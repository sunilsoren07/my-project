  // ---------------------------------------------------------------
  // View: By Status (bucket-first grouping — items live in the
  // bucket that matches their OWN status, not their source sheet)
  // ---------------------------------------------------------------
  function renderStatusView(term) {
    let html = '';
    let visiblePgaCount = new Set();
    let visibleItemCount = 0;

    BUCKET_ORDER.forEach(bucket => {
      if (state.bucketFilter && state.bucketFilter !== bucket) return;
      let items = ALL_ITEMS.filter(it => it.bucket === bucket && itemMatchesSearch(it, term) && moduleMatch(it, state.moduleFilter) && modTypeMatch(it, state.modTypeFilter));
      if (state.owner) items = items.filter(it => {
        const pg = PGA_INDEX.find(p => p.gid === it.gid);
        return pg && filterHas(state.owner, pg.person);
      });
      if (state.overallFilter) items = items.filter(it => {
        const pg = PGA_INDEX.find(p => p.gid === it.gid);
        return pg && pgaMatchesOverall(pg, state.overallFilter);
      });
      if (selectedValues(state.pga).length) items = items.filter(it => filterHas(state.pga, it.pga));
      if (!items.length) return;

      const byPga = new Map();
      items.forEach(it => {
        if (!byPga.has(it.gid)) byPga.set(it.gid, []);
        byPga.get(it.gid).push(it);
      });
      const pgaGroups = PGA_INDEX.filter(pg => byPga.has(pg.gid));
      html += `<div class="section-label">${SECTION_TITLES[bucket].toUpperCase()} · ${pgaGroups.length} AGENC${pgaGroups.length === 1 ? 'Y' : 'IES'} · ${items.length} ITEM${items.length === 1 ? '' : 'S'}</div>`;
      pgaGroups.forEach(pg => {
        visiblePgaCount.add(pg.gid);
        visibleItemCount += byPga.get(pg.gid).length;
        html += renderGroupCard(pg, byPga.get(pg.gid), term, bucket);
      });
    });

    if (!html) html = `<div class="empty-state">No agencies or certificates match your filters.</div>`;
    document.getElementById('resultCount').textContent = `${visiblePgaCount.size} agenc${visiblePgaCount.size === 1 ? 'y' : 'ies'} · ${visibleItemCount} item${visibleItemCount === 1 ? '' : 's'}`;
    return html;
  }

  // ---------------------------------------------------------------
  // View: PGA Listing
  // ---------------------------------------------------------------
  function pgaAggregateStatus(pg) {
    const counts = { deployed: 0, development: 0, discussion: 0, notstarted: 0 };
    pg.items.forEach(it => counts[it.bucket]++);
    const total = pg.items.length;
    if (counts.deployed === total) return { label: 'Fully Deployed', bucket: 'deployed' };
    if (counts.deployed > 0) return { label: 'Partially Deployed', bucket: 'deployed' };
    if (counts.development > 0) return { label: 'In Development', bucket: 'development' };
    if (counts.discussion > 0) return { label: 'Discussion', bucket: 'discussion' };
    return { label: 'Not Started', bucket: 'notstarted' };
  }


  function renderPgaItemSummary(pg) {
    const items = pg.items || [];
    const completed = items.filter(it => it.bucket === 'deployed');
    const pending = items.filter(it => it.bucket !== 'deployed');
    const total = items.length;
    const pct = total ? (completed.length / total * 100) : 0;
    const pctText = pct.toFixed(1).replace('.0', '');

    const list = (arr, done) => arr.length
      ? arr.map(it => `
          <div class="pga-completion-item">
            <span class="pga-completion-icon">${done ? '✓' : '⏳'}</span>
            <div>
              <div class="pga-completion-name">${esc(it.type || 'Untitled item')}</div>
              <div class="pga-completion-status">${esc(it.status || 'Status not specified')}</div>
            </div>
          </div>`).join('')
      : `<div class="pga-completion-empty">${done ? 'No completed/deployed items.' : 'No pending items.'}</div>`;

    return `
      <div class="pga-item-summary">
        <div class="pga-summary-top">
          <div>
            <div class="pga-summary-title">Item / Module Status</div>
            <div class="pga-summary-sub">${esc(pg.pga)} · ${total} total ${total === 1 ? 'item' : 'items'}</div>
          </div>
          <div class="pga-summary-message">${completed.length} out of ${total} ${total === 1 ? 'Item' : 'Items'} Completed</div>
        </div>
        <div class="pga-summary-kpis">
          <div class="pga-summary-kpi"><strong>${total}</strong><span>Total Items</span></div>
          <div class="pga-summary-kpi done"><strong>${completed.length}</strong><span>Completed / Deployed</span></div>
          <div class="pga-summary-kpi pending"><strong>${pending.length}</strong><span>Pending / Not Completed</span></div>
          <div class="pga-summary-kpi progress"><strong>${pctText}%</strong><span>Overall Progress</span></div>
        </div>
        <div class="pga-completion-track" aria-label="${pctText}% completed"><div style="width:${pct}%;"></div></div>
        <div class="pga-completion-lists">
          <div class="pga-completion-list done">
            <div class="pga-completion-list-head"><span>✓ Completed / Deployed</span><b>${completed.length}</b></div>
            <div class="pga-completion-list-body">${list(completed, true)}</div>
          </div>
          <div class="pga-completion-list pending">
            <div class="pga-completion-list-head"><span>⏳ Pending / Not Completed</span><b>${pending.length}</b></div>
            <div class="pga-completion-list-body">${list(pending, false)}</div>
          </div>
        </div>
      </div>`;
  }

  function renderPgaView(term) {
    let rows = PGA_INDEX.filter(pg => {
      if (!filterHas(state.pga, pg.pga)) return false;
      if (!filterHas(state.owner, pg.person)) return false;
      if (term) {
        const inName = matchesSearch(pg.pga, term);
        const inItems = pg.items.some(it => itemMatchesSearch(it, term));
        if (!inName && !inItems) return false;
      }
      if (state.bucketFilter) {
        const hasBucket = pg.items.some(it => it.bucket === state.bucketFilter);
        if (!hasBucket) return false;
      }
      if (state.moduleFilter) {
        const hasModule = pg.items.some(it => moduleMatch(it, state.moduleFilter));
        if (!hasModule) return false;
      }
      if (state.modTypeFilter) {
        const hasType = pg.items.some(it => modTypeMatch(it, state.modTypeFilter)) ||
          LIC_ITEMS.some(it => it.gid === pg.gid && modTypeMatch(it, state.modTypeFilter));
        if (!hasType) return false;
      }
      if (state.overallFilter && !pgaMatchesOverall(pg, state.overallFilter)) return false;
      return true;
    });

    document.getElementById('resultCount').textContent = `${rows.length} agenc${rows.length === 1 ? 'y' : 'ies'}`;
    if (!rows.length) return `<div class="empty-state">No agencies match your filters.</div>`;

    const body = rows.map(pg => {
      const agg = pgaAggregateStatus(pg);
      const counts = { deployed: 0, development: 0, discussion: 0, notstarted: 0 };
      pg.items.forEach(it => counts[it.bucket]++);
      const total = pg.items.length || 1;
      const bar = BUCKET_ORDER.map(b => `<div class="mini-seg" style="width:${counts[b]/total*100}%; background:var(--${b})"></div>`).join('');
      const isOpen = state.openGroups.has('pgaview:' + pg.gid);
      let detailItems = pg.items;
      if (state.moduleFilter) detailItems = detailItems.filter(it => moduleMatch(it, state.moduleFilter));
      if (state.bucketFilter) detailItems = detailItems.filter(it => it.bucket === state.bucketFilter);
      const meetingLabel = pg.meeting ? (pg.meeting.status === 'Completed' ? 'Meeting completed' : (pg.meeting.date || 'Meeting scheduled')) : 'Schedule meeting';
      const teamLabel = pg.team ? [pg.team.resource, pg.team.inspector, pg.team.superintendent].filter(Boolean).length + ' assigned' : 'Assign team';
      return `
        <tr data-toggle="pgaview:${pg.gid}">
          <td class="td-sno">${esc(pg.sno)}</td>
          <td class="td-name">${highlight(pg.pga, term)}</td>
          <td>${itemBadge(agg.bucket, agg.label)}</td>
          <td><div class="mini-bar">${bar}</div></td>
          <td>${pg.items.length}</td>
          <td>${pg.person ? esc(pg.person) : '—'}</td>
          <td>${pg.meeting ? esc(pg.meeting.date || 'Set') : '—'}</td>
        </tr>
        <tr class="row-detail ${isOpen ? 'open' : ''}" data-detail="${pg.gid}">
          <td colspan="7">
            <div class="pga-card open" style="border:none; border-radius:0; margin:0;">
              <div class="pga-body" style="display:block; border-top:1px solid var(--border-soft);">
                ${state.openTeam === pg.gid ? teamPanelHtml(pg) : state.openMeeting === pg.gid ? meetingPanelHtml(pg) : `<div style="padding:10px 18px; display:flex; gap:8px; flex-wrap:wrap;">
                  <span class="team-chip ${pg.team ? '' : 'empty'}" data-team-toggle="${pg.gid}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>${esc(teamLabel)}</span>
                  <span class="meeting-chip ${pg.meeting ? '' : 'empty'}" data-meeting-toggle="${pg.gid}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>${esc(meetingLabel)}</span>
                </div>`}
                ${pg.team ? `<div style="padding:0 18px 10px; display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;">
                  ${pg.team.resource ? `<span>Resource: <span style="color:var(--text-dim)">${esc(pg.team.resource)}</span></span>` : ''}
                  ${pg.team.inspector ? `<span>Inspector: <span style="color:var(--text-dim)">${esc(pg.team.inspector)}</span></span>` : ''}
                  ${pg.team.superintendent ? `<span>Superintendent: <span style="color:var(--text-dim)">${esc(pg.team.superintendent)}</span></span>` : ''}
                </div>` : ''}
                ${renderPgaItemSummary(pg)}
                 ${detailItems.map(it => renderItemRow(it, term)).join('')}
              </div>
            </div>
          </td>
        </tr>`;
    }).join('');

    return `
      <table class="pga-table">
        <thead><tr><th>S.No</th><th>Agency</th><th>Overall status</th><th>Item mix</th><th>Items</th><th>Owner</th><th>Meeting</th></tr></thead>
        <tbody>${body}</tbody>
      </table>`;
  }

  // ---------------------------------------------------------------
  // Views: Single Sign On / Licence & Consumption (separate tabs)
  // ---------------------------------------------------------------
  function filterModuleList(list, term) {
    let out = list.filter(it => itemMatchesSearch(it, term));
    if (selectedValues(state.pga).length) out = out.filter(it => filterHas(state.pga, it.pga));
    if (state.owner) out = out.filter(it => {
      const pg = PGA_INDEX.find(p => p.gid === it.gid);
      return pg && filterHas(state.owner, pg.person);
    });
    if (state.overallFilter) out = out.filter(it => {
      const pg = PGA_INDEX.find(p => p.gid === it.gid);
      return pg && pgaMatchesOverall(pg, state.overallFilter);
    });
    if (state.bucketFilter) out = out.filter(it => it.bucket === state.bucketFilter);
    if (state.modTypeFilter) out = out.filter(it => modTypeMatch(it, state.modTypeFilter));
    return out;
  }

  function renderModuleRows(list, term) {

      const title = it.isLic ? `${it.pga} — ${it.type}` : it.pga;

      const updatesHtml = (it.ssoUpdates || []).length ? `<div style="margin-top:8px; display:flex; flex-direction:column; gap:4px;">${it.ssoUpdates.map(u => `<div class="mp-point read-only"><span class="mp-point-date">${esc(u.date)}</span><span class="mp-point-text">${highlight(u.text, term)}</span></div>`).join('')}</div>` : '';
      return `
      <div class="item-row" style="padding-left:18px;" data-module-open="${it._id}">
        <div class="item-main">

  }

  function enhanceMultiFilters(){
    ['pgaFilter','overallFilter','ownerFilter','modTypeFilter'].forEach(id=>{
      const sel=document.getElementById(id); if(!sel || sel.dataset.multiReady) return;
      sel.dataset.multiReady='1'; sel.multiple=true; sel.classList.add('native-multi-source');
      const wrap=document.createElement('div'); wrap.className='multi-filter'; wrap.dataset.for=id;
      const btn=document.createElement('button'); btn.type='button'; btn.className='multi-filter-btn';
      const menu=document.createElement('div'); menu.className='multi-filter-menu';
      const optionHost=document.createElement('div'); optionHost.className='multi-filter-options';
      const search = id==='pgaFilter' ? document.createElement('input') : null;
      if(search){
        search.type='search'; search.className='multi-filter-search'; search.placeholder='Search PGA...'; search.autocomplete='off';
        const searchWrap=document.createElement('div'); searchWrap.className='multi-filter-search-wrap';
        searchWrap.appendChild(search); menu.appendChild(searchWrap);
        search.addEventListener('input',()=>{
          const q=search.value.trim().toLowerCase();
          optionHost.querySelectorAll('[data-filter-option]').forEach(lab=>{
            lab.style.display=!q || lab.dataset.label.toLowerCase().includes(q)?'flex':'none';
          });
          const allLabel=optionHost.querySelector('.multi-filter-all');
          if(allLabel) allLabel.style.display='flex';
        });
      }
      menu.appendChild(optionHost);
      function label(){
        const vals=Array.from(sel.selectedOptions).map(o=>o.value).filter(Boolean);
        if(!vals.length){ btn.textContent = id==='pgaFilter'?'All agencies':id==='overallFilter'?'All overall statuses':id==='ownerFilter'?'All owners':'All module types'; }
        else if(vals.length===1){ btn.textContent=sel.selectedOptions[0].textContent; }
        else { btn.textContent=vals.length+' selected'; }
        btn.title=vals.length>1?Array.from(sel.selectedOptions).map(o=>o.textContent).join(', '):btn.textContent;
      }
      function syncChecks(){
        optionHost.querySelectorAll('input[data-value]').forEach(c=>{
          const o=Array.from(sel.options).find(x=>x.value===c.dataset.value);
          if(o) c.checked=o.selected;
        });
        const allCb=optionHost.querySelector('[data-all-check]');
        if(allCb) allCb.checked=Array.from(sel.selectedOptions).filter(o=>o.value).length===0;
        label();
      }
      function rebuild(){
        optionHost.innerHTML='';
        const all=document.createElement('label'); all.className='multi-filter-option multi-filter-all';
        const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.allCheck='1';
        cb.checked=Array.from(sel.selectedOptions).filter(o=>o.value).length===0;
        all.append(cb, document.createTextNode('All / Clear selection')); optionHost.appendChild(all);
        cb.addEventListener('change',()=>{
          if(cb.checked){
            Array.from(sel.options).forEach(o=>o.selected=false);
            sel.dispatchEvent(new Event('change',{bubbles:true}));
            syncChecks();
          } else if(!Array.from(sel.selectedOptions).some(o=>o.value)) {
            cb.checked=true;
          }
        });
        Array.from(sel.options).filter(o=>o.value).forEach(o=>{
          const lab=document.createElement('label'); lab.className='multi-filter-option'; lab.dataset.filterOption='1'; lab.dataset.label=o.textContent.toLowerCase();
          const c=document.createElement('input'); c.type='checkbox'; c.dataset.value=o.value; c.checked=o.selected;
          lab.append(c,document.createTextNode(o.textContent)); optionHost.appendChild(lab);
          c.addEventListener('change',()=>{
            o.selected=c.checked;
            if(!c.checked && !Array.from(sel.selectedOptions).some(x=>x.value)){
              Array.from(sel.options).forEach(x=>x.selected=false);
            }
            sel.dispatchEvent(new Event('change',{bubbles:true}));
            syncChecks();
          });
        });
        if(search) search.value='';
      }
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        document.querySelectorAll('.multi-filter.open').forEach(x=>x!==wrap&&x.classList.remove('open'));
        wrap.classList.toggle('open');
        if(wrap.classList.contains('open') && search){ setTimeout(()=>search.focus(),0); }
      });
      wrap.addEventListener('click',e=>e.stopPropagation());
      wrap.append(btn,menu); sel.parentNode.insertBefore(wrap,sel.nextSibling); rebuild(); label();
    });
    if(!window.__multiFilterDocBound){
      window.__multiFilterDocBound=true;
      document.addEventListener('click',()=>document.querySelectorAll('.multi-filter.open').forEach(x=>x.classList.remove('open')));
    }
  }

  // Enhanced dashboard features: module detail, Excel export, Kanban
  // ===============================================================
  function allDashboardModules(){
    const base = ALL_ITEMS.slice();
    const lic = LIC_ITEMS.slice();
    return base.concat(lic);
  }

  function filteredPgasForExport(){
    const term = state.search.trim().toLowerCase();
    return PGA_INDEX.filter(pg => {
      if(!filterHas(state.pga, pg.pga)) return false;
      if(!filterHas(state.owner, pg.person)) return false;
      if(state.overallFilter && !pgaMatchesOverall(pg,state.overallFilter)) return false;
      if(term){
        const okName = matchesSearch(pg.pga,term);
        const okItems = pg.items.some(it => itemMatchesSearch(it,term)) ||
          LIC_ITEMS.some(it => it.gid===pg.gid && itemMatchesSearch(it,term));
        if(!okName && !okItems) return false;
      }
      if(state.bucketFilter && !pg.items.some(it=>it.bucket===state.bucketFilter)) return false;
      return true;
    });
  }

  function exportRows(kind){
    const rows = [];
    const term = state.search.trim().toLowerCase();
    const pgas = filteredPgasForExport();
    const pgaIds = new Set(pgas.map(p=>p.gid));

    if(kind === 'meetings'){
      pgas.filter(pg=>pg.meeting).forEach(pg=>{
        rows.push({
          'S.No':pg.sno,'PGA':pg.pga,'Owner':pg.person||'',
          'Meeting Date':pg.meeting.date||'','Meeting Status':pg.meeting.status||'',
          'Discussion Points':(pg.meeting.points||[]).map(x=>x.text).join(' | ')
        });
      });
      return rows;
    }

    const modules = allDashboardModules().filter(it=>{
      if(!pgaIds.has(it.gid)) return false;
      if(term && !itemMatchesSearch(it,term) && !matchesSearch(it.pga,term)) return false;
      if(state.bucketFilter && it.bucket!==state.bucketFilter) return false;
      return true;
    });

    const chosen = kind === 'pending'
      ? modules.filter(it=>it.bucket!=='deployed')
      : modules;

    if(kind === 'current'){
      chosen.forEach(it=>rows.push({
        'S.No':it.sno,'PGA':it.pga,'Module / Item':it.type||'',
        'Import / Export':it.ie||'','Current Status':it.status||'',
        'Pending With':it.pendingWith||'',

  function cleanStatus(s){
    const v=String(s||'').trim(), l=v.toLowerCase();
    if(l.includes('deployed')) return 'Deployed in Production';
    if(l.includes('not started') || l==='notstarted') return 'Development Not Started';

    if(l.includes('infosys') && l.includes('test')) return 'Infosys Testing';

    if(l.includes('dccs') && l.includes('vapt')) return 'DCCS VAPT';
    if(l.includes('ma vapt')) return 'MA VAPT';
    if(l.includes('development')) return 'In Development';
    return v;
  }
  function bucketForStatus(s){
    const l=String(s||'').toLowerCase();
    if(l.includes('deployed')) return 'deployed';
    if(l.includes('discussion')) return 'discussion';
    if(l.includes('not started')) return 'notstarted';
    return 'development';
  }

  function buildData(){
    // Start from the original data and apply additions/deletions/edits.
    ALL_ITEMS=[]; LIC_ITEMS=[]; const pgaMap=new Map();
    function ensure(pga,sno,owner,person){
      const gid=slugify(pga); if(!pgaMap.has(pga)) pgaMap.set(pga,{pga,sno,owner:owner||'',person:person||'',gid,items:[]});
      const g=pgaMap.get(pga); if(!g.owner&&owner)g.owner=owner; if(!g.person&&person)g.person=person; return g;
    }
    (PGA_DATA.developed||[]).forEach(g=>{const p=ensure(g.pga,g.sno,'','');(g.items||[]).forEach(i=>p.items.push(Object.assign({},i,{pga:g.pga,sno:g.sno,gid:p.gid,origin:'developed'})));});
    (PGA_DATA.development||[]).forEach(g=>{const p=ensure(g.pga,g.sno,g.owner,g.person);(g.items||[]).forEach(i=>p.items.push(Object.assign({},i,{pga:g.pga,sno:g.sno,gid:p.gid,origin:'development'})));});
    (PGA_DATA.initial||[]).forEach(g=>{const p=ensure(g.pga,g.sno,'','');(g.items||[]).forEach(i=>p.items.push(Object.assign({},i,{pga:g.pga,sno:g.sno,gid:p.gid,origin:'initial'})));});
    (PGA_DATA.notStarted||[]).forEach(g=>{const p=ensure(g.pga,g.sno,'','');p.items.push({_id:g._id,type:'Integration',desc:g.status,status:'Development Not Started',pga:g.pga,sno:g.sno,gid:p.gid,origin:'notStarted'});});
    Object.values(ADDED_MODULES||{}).forEach(i=>{if(DELETED_MODULES[i._id])return; const p=ensure(i.pga,'','',''); p.items.push(Object.assign({},i,{origin:'custom'}));});
    pgaMap.forEach(pg=>{
      const seen=new Set();
      pg.items=pg.items.filter(i=>{if(DELETED_MODULES[i._id])return false;if(i.origin==='custom')return true;const k=(i.type||'').trim().toLowerCase()+'|'+(i.desc||'').trim().toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
      pg.items.forEach(i=>{const ov=EDITS[i._id];if(ov)Object.assign(i,ov);if(!i.customStatus)i.status=cleanStatus(i.status);i.bucket=bucketForStatus(i.status);ALL_ITEMS.push(i);});
      pg.meeting=MEETINGS[pg.gid]||null;pg.team=TEAM[pg.gid]||null;
    });
    PGA_INDEX=Array.from(pgaMap.values()).sort((a,b)=>a.pga.localeCompare(b.pga));PGA_INDEX.forEach((p,i)=>p.sno=String(i+1));
    (PGA_DATA.licConsumption||[]).forEach(g=>{const p=pgaMap.get(g.pga),gid=p?p.gid:slugify(g.pga);(g.items||[]).forEach(i=>{if(DELETED_MODULES[i._id])return;const b=Object.assign({},i,{pga:g.pga,sno:p?p.sno:g.sno,gid,type:i.lpco,desc:i.definition,remarks:i.desc,isLic:true});const ov=EDITS[i._id];if(ov)Object.assign(b,ov);if(!b.customStatus)b.status=cleanStatus(b.status);b.bucket=bucketForStatus(b.status);LIC_ITEMS.push(b);});});
  }

  function rodNormalizeText(text){
    return String(text||'').replace(/\u00A0/g,' ').replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  }
  function rodDateToISO(value){
    const v=String(value||'').trim();
    let m=v.match(/\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);
    if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    m=v.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/);
    if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}
    const d=new Date(v);
    if(!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return '';
  }
  function rodFindField(text, labels){
    const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    for(const line of lines){
      for(const label of labels){
        const re=new RegExp('^'+label.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')+'\\s*(?:[:\\-]|\\s{2,})\\s*(.+)$','i');
        const m=line.match(re); if(m && m[1] && m[1].length<600)return m[1].trim();
      }
    }
    for(const label of labels){
      const re=new RegExp(label+'\\s*[:\\-]?\\s*([^\\n]{2,300})','i');
      const m=text.match(re); if(m && m[1])return m[1].trim();
    }
    return '';
  }
  function rodFindLongField(text, labels){
    for(const label of labels){
      const re=new RegExp(label+'\\s*[:\\-]?\\s*([\\s\\S]{2,800}?)(?=\\n[A-Z][A-Z /&_-]{3,40}\\s*[:\\-]|$)','i');
      const m=text.match(re);if(m)return m[1].trim().replace(/\n+/g,' ');
    }
    return '';
  }
  function rodDetectStatus(text){
    const t=text.toLowerCase();
    const explicit=rodFindField(text,['Current Status','Status','Integration Status']);
    const source=(explicit||text).toLowerCase();
    const map=[
      ['Deployed in Production','deployed in production'],
      ['Deployed in Production','deployed'],
      ['MA VAPT','ma vapt'],
      ['DCCS VAPT','dccs vapt'],
      ['Integration Testing','integration testing'],
      ['Infosys Testing','infosys testing'],
      ['Development Not Started','development not started'],
      ['In Discussion','in discussion'],
      ['In Development','in development']
    ];
    for(const [label,key] of map)if(source.includes(key))return label;
    return explicit || '';
  }
  function rodExtractDetails(text){
    text=rodNormalizeText(text);
    const status=rodDetectStatus(text);
    const details={
      type:rodFindField(text,['Module Name','Module','Integration Name','LPCO']),
      modtype:rodFindField(text,['Module Type','Type','Integration Type']),
      ie:rodFindField(text,['Import / Export','Import/Export','Trade Type']),
      status:status,
      pendingWith:rodFindField(text,['Pending With','Pending Owner','Owner','Pending By']),
      desc:rodFindLongField(text,['Description','Module Description','Integration Description']),
      additionalDetails:rodFindLongField(text,['What Additional Details Are Required','Additional Details Required','Additional Details','Requirements']),
      remarks:rodFindLongField(text,['Remarks / Comments','Remarks','Comments','Next Action','Latest Update']),
      plannedStartDate:rodDateToISO(rodFindField(text,['Planned Start Date','Start Date','Planned Date'])),
      targetDate:rodDateToISO(rodFindField(text,['Target production Deployment Date','Target Production Deployment Date','Target Date','Expected Completion Date','Completion Date','Go-live Date','Go-live / Planned Date']))
    };
    // If no explicit module name exists, use a strong common heading candidate.
    if(!details.type){
      const candidate=text.split('\n').map(x=>x.trim()).find(x=>/^(module|integration|project)\s*(name)?\s*[:\-]/i.test(x));
      if(candidate)details.type=candidate.replace(/^[^:\-]+[:\-]\s*/,'').trim();
    }
    details.sourceDocument='';
    return details;
  }
  async function rodExtractText(file){
    const name=file.name.toLowerCase();
    if(name.endsWith('.txt')||name.endsWith('.csv')) return await file.text();
    if(name.endsWith('.docx')){
      if(!window.mammoth)throw new Error('DOCX reader is not available. Please open the dashboard with internet access once.');
      const buf=await file.arrayBuffer();
      const result=await mammoth.extractRawText({arrayBuffer:buf});
      return result.value||'';
    }
    if(name.endsWith('.pdf')){
      if(!window.pdfjsLib)throw new Error('PDF reader is not available. Please open the dashboard with internet access once.');
      const buf=await file.arrayBuffer();
      const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
      let text='';
      for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
        const page=await pdf.getPage(pageNo); const content=await page.getTextContent();
        text+=content.items.map(x=>x.str||'').join(' ')+'\n';
      }
      return text;
    }
    throw new Error('Unsupported document type. Upload PDF, DOCX, TXT or CSV.');
  }
  function rodSetField(modal,key,value){
    if(value===undefined||value===null||value==='')return false;

  function rodShowDetected(modal,details,fileName){
    const box=modal.querySelector('#rodDetected'), grid=modal.querySelector('#rodDetectedGrid');

    const labels={type:'Module Name',modtype:'Module Type',ie:'Import / Export',status:'Status',pendingWith:'Pending With',plannedStartDate:'Planned Start Date',targetDate:'Target production Deployment Date'};
    const entries=Object.entries(labels).filter(([k])=>details[k]);
    grid.innerHTML=entries.map(([k,l])=>`<div><b>${esc(l)}:</b> ${esc(details[k])}</div>`).join('') || '<div>No labelled fields were detected. The document may be scanned/image-only.</div>';

  async function handleRodUpload(modal,file){
    const status=modal.querySelector('#rodUploadStatus');
    if(!file)return;
    status.textContent='Reading '+file.name+'…';status.className='rod-upload-status';
    try{
      const text=await rodExtractText(file);
      if(!rodNormalizeText(text)){throw new Error('No selectable text was found in the document. A scanned/image-only RoD needs OCR before it can be auto-read.');}
      const details=rodExtractDetails(text);details.sourceDocument=file.name;
      Object.entries(details).forEach(([k,v])=>{if(k!=='sourceDocument')rodSetField(modal,k,v);});
      // Store source document name in a temporary modal attribute; it is saved with the module.
      modal.dataset.rodSource=file.name;
      // Status dropdown needs exact matching. If the extracted status is custom, use Other.
      const statusSel=modal.querySelector('[data-mf="status"]');
      if(statusSel && details.status){
        const found=[...statusSel.options].find(o=>o.value.toLowerCase()===String(details.status).toLowerCase());
        const customWrap=modal.querySelector('[data-custom-status-wrap]');
        if(found){statusSel.value=found.value;customWrap?.classList.remove('show');}
        else{statusSel.value='__manual__';customWrap?.classList.add('show');rodSetField(modal,'customStatus',details.status);}
      }
      if(!details.type){
        status.textContent=`Read ${file.name}, but no module name was detected. Please review the fields.`;status.className='rod-upload-status warn';
      }else{
        status.textContent=`Auto-filled from ${file.name}. Review and click Save Changes.`;status.className='rod-upload-status ok';
      }
      rodShowDetected(modal,details,file.name);
    }catch(err){
      console.error(err);status.textContent=err.message||'Could not read the document.';status.className='rod-upload-status warn';
    }
  }

    const input=modal.querySelector('#rodFileInput');if(!input)return;

/* ============================================================
   PGA-level document upload and auto-update
   ============================================================ */
async function extractPgaDocumentText(file){
  const name = (file.name || '').toLowerCase();
  if(name.endsWith('.txt') || name.endsWith('.csv')){
    return await file.text();
  }
  if(name.endsWith('.pdf') && window.pdfjsLib){
    const buffer = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data:buffer}).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(x=>x.str).join(' ') + '\n';
    }
    return text;
  }
  if(name.endsWith('.docx') && window.mammoth){
    const buffer = await file.arrayBuffer();
    const result = await window.mammoth.extractRawText({arrayBuffer:buffer});
    return result.value || '';
  }
  throw new Error('Please upload a PDF, DOCX, TXT or CSV file.');
}

function parsePgaDocument(text){
  const t = String(text || '').replace(/\r/g,'');
  const lines = t.split('\n').map(x=>x.trim()).filter(Boolean);

  const findVal = (labels) => {
    for(const label of labels){
      const re = new RegExp('(?:^|\\n)\\s*' + label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*[:\\-]\\s*(.+)', 'i');
      const m = t.match(re);
      if(m) return m[1].trim();
    }
    return '';
  };

  const modules = [];
  const moduleRegex = /(?:module|integration|component)\s*(?:name)?\s*[:\-]\s*([^\n]+)(?:\n[\s\S]{0,500}?(?:status)\s*[:\-]\s*([^\n]+))?/ig;
  let m;
  while((m = moduleRegex.exec(t)) && modules.length < 100){
    modules.push({
      type: m[1].trim(),
      status: (m[2] || '').trim()
    });
  }

  const statusWords = [
    'In Discussion','Development Not Started','In Development','Infosys Testing',
    'Integration Testing','DCCS VAPT','MA VAPT','Deployed in Production'
  ];
  let detectedStatus = findVal(['Status','Current Status','Overall Status']);
  if(!detectedStatus){
    detectedStatus = statusWords.find(s => t.toLowerCase().includes(s.toLowerCase())) || '';
  }

  return {
    pgaName: findVal(['PGA','PGA Name','Agency','Agency Name']) || '',
    owner: findVal(['Owner','PGA Owner','Responsible Officer']) || '',
    status: detectedStatus,
    summary: findVal(['Summary','Remarks','Comments','Latest Update']) || '',
    pendingWith: findVal(['Pending With','Pending with']) || '',
    targetDate: findVal(['Target production Deployment Date','Target Production Deployment Date','Target Date','Expected Completion Date','Planned Date']) || '',
    modules
  };
}

function openPgaUpload(pga){
  const input=document.createElement('input');
  input.type='file';
  input.className='pga-upload-input';
  input.accept='.pdf,.docx,.txt,.csv';
  input.onchange=async()=>{
    const file=input.files && input.files[0];
    if(!file) return;
    const card = document.querySelector(`.pga-card[data-gid="${CSS.escape(pga.gid)}"]`);
    if(card){
      const old=card.querySelector('.pga-doc-status');
      if(old) old.remove();
      const msg=document.createElement('div');
      msg.className='pga-doc-status';
      msg.textContent=`Reading ${file.name}…`;
      card.querySelector('.pga-body')?.prepend(msg);
    }
    try{
      const text=await extractPgaDocumentText(file);
      if(!text.trim()) throw new Error('No readable text was found in the document.');
      const parsed=parsePgaDocument(text);
      showPgaDocumentPreview(pga,file,parsed);
    }catch(err){
      alert(err.message || 'Unable to read the document.');
    }
  };
  document.body.appendChild(input);
  input.click();
  input.remove();
}

  const card=document.querySelector(`.pga-card[data-gid="${CSS.escape(pga.gid)}"]`);
  if(!card) return;
  let wrap=card.querySelector('.pga-auto-preview');
  if(!wrap){
    wrap=document.createElement('div');
    wrap.className='pga-auto-preview';
    card.querySelector('.pga-body')?.prepend(wrap);
  }
  const modCount=parsed.modules.length;
  wrap.innerHTML=`
    <div class="pga-auto-preview-title">Document detected · review before applying</div>
    <div class="pga-auto-preview-grid">
      <div class="pga-auto-preview-item"><b>File:</b> ${esc(file.name)}</div>
      <div class="pga-auto-preview-item"><b>PGA:</b> ${esc(parsed.pgaName || pga.pga)}</div>

async function applyPgaDocumentUpdate(pga,file,parsed){
  /* Update PGA-level metadata where the current data model supports it. */
  const existing = PGA_INDEX.find(x=>x.gid===pga.gid);
  if(existing){
    if(parsed.owner) existing.person=parsed.owner;
    if(parsed.status) existing.status=parsed.status;
  }

  /* Add detected modules under the selected PGA. */
  if(parsed.modules && parsed.modules.length){
    if(!Array.isArray(pga.items)) pga.items=[];
    parsed.modules.forEach((mod,idx)=>{
      if(!mod.type) return;
      const newId=`${pga.gid}--uploaded-${Date.now()}-${idx}`;
      pga.items.push({
        _id:newId,
        gid:pga.gid,
        pga:pga.pga,
        sno:pga.sno,
        type:mod.type,
        modtype:'Document-detected module',
        ie:'',
        desc:'',
        status:mod.status || parsed.status || 'Development Not Started',
        pendingWith:parsed.pendingWith || '',
        pendingAt:parsed.pendingAt || '',
        additionalDetails:'',
        remarks:parsed.summary || `Imported from ${file.name}`,
        expectedCompletion:parsed.targetDate || '',
        lastFollowUp:'',
        uploadedDocument:file.name
      });
    });
  }else if(parsed.status){
    /* No modules detected: update existing modules with the detected PGA status. */
    pga.items.forEach(item=>{ item.status=parsed.status; });
  }

  /* Refresh the normalized collections used elsewhere by the app. */
  if(typeof buildData==='function') buildData();
  if(typeof render==='function') render();
  if(state.view==='kanban' && typeof renderKanbanDashboard==='function') renderKanbanDashboard();

  const card=document.querySelector(`.pga-card[data-gid="${CSS.escape(pga.gid)}"]`);
  if(card){
    const msg=document.createElement('div');
    msg.className='pga-doc-status';
    msg.textContent=`✓ ${file.name} applied to ${pga.pga}. ${parsed.modules.length ? parsed.modules.length+' module(s) added.' : 'PGA/module details updated.'}`;
    card.querySelector('.pga-body')?.prepend(msg);
  }
}

function parseAgendaDocumentPoints(text){
  const raw = String(text || '').replace(/\r/g,'');
  const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const out = [];
  let active = false;

  for(const line of lines){
    if(/^(agenda|agenda point|agenda points|meeting agenda)\s*:?\s*$/i.test(line)){
      active = true;
      continue;
    }
    if(active && /^(attendees|participants|date|time|venue|remarks|minutes|mom|discussion points|action points)\s*:?\s*$/i.test(line)){
      active = false;
      continue;
    }
    if(active){
      const cleaned = line.replace(/^[-•*]\s*/,'').replace(/^\d+[\).\-\s]+/,'').trim();
      if(cleaned.length >= 4) out.push(cleaned);
    }
  }

  if(!out.length){
    for(const line of lines){
      const m=line.match(/^(?:[-•*]\s+|\d+[\).\-\s]+)(.+)$/);
      if(m && m[1].trim().length >= 6) out.push(m[1].trim());
    }
  }
  return Array.from(new Set(out)).slice(0,30);
}

  function buildMomChanges(gid,meeting){
    const pg=PGA_INDEX.find(p=>p.gid===gid);
    const mod=pg?.items.find(i=>i._id===meeting.moduleId);
    if(!mod) return [];
    const text=String(meeting.momText||'');
    const changes=[];
    const lower=text.toLowerCase();

    const statuses=['In Discussion','Development Not Started','In Development','Infosys Testing','Integration Testing','DCCS VAPT','MA VAPT','Deployed in Production'];
    const detectedStatus=statuses.find(s=>lower.includes(s.toLowerCase()));
    if(detectedStatus && detectedStatus!==String(mod.status||'')){
      changes.push({id:'status',field:'Current Status',type:'Changed information',kind:'changed',old:mod.status||'—',value:detectedStatus});
    }

    const section=(names)=>{
      const re=new RegExp('(?:^|\\n)\\s*(?:'+names.join('|')+')\\s*:?\\s*\\n([\\s\\S]*?)(?=\\n\\s*[A-Za-z][A-Za-z /&-]{2,40}\\s*:?\\s*(?:\\n|$)|$)','i');
      const m=text.match(re);return m?m[1].trim():'';
    };
    const pending=section(['pending items','pending','pending points']);
    const actions=section(['action items','actions','next steps']);
    const decisions=section(['decisions','decision']);
    const discussion=section(['discussion points','discussion','key discussion']);
    const responsible=section(['responsible','owner','pending with','action owner']);

    if(pending && pending!==String(mod.pendingAt||mod.pendingWith||'')){
      changes.push({id:'pending',field:'Pending / Pending With',type:'Pending information',kind:'pending',old:(mod.pendingWith||mod.pendingAt||'—'),value:pending});
    }
    if(actions && actions!==String(mod.remarks||'')){
      changes.push({id:'actions',field:'Remarks / Action Items',type:'New information',kind:'new',old:mod.remarks||'—',value:actions});
    }
    if(decisions){
      changes.push({id:'decisions',field:'Decisions',type:'New information',kind:'new',old:'Not recorded',value:decisions});
    }
    if(discussion){
      changes.push({id:'discussion',field:'Discussion Points',type:'New information',kind:'new',old:'Not recorded',value:discussion});
    }
    if(responsible){
      changes.push({id:'responsible',field:'Responsible Person / Team',type:'New information',kind:'new',old:'Not recorded',value:responsible});
    }

    const dateMatch=text.match(/(?:target|completion|due)\s*(?:date)?\s*[:\-]\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|\d{4}-\d{2}-\d{2})/i);
    if(dateMatch){
      changes.push({id:'target',field:'Expected Completion Date',type:'New information',kind:'new',old:mod.expectedCompletion||mod.golive||'—',value:dateMatch[1]});
    }
    return changes;
  }

  async function applyMomChanges(gid,meetingId,changes){
    const pg=PGA_INDEX.find(p=>p.gid===gid);
    const records=meetingHistory(gid).slice();
    const idx=records.findIndex(x=>(x.meetingId||'')===meetingId);
    if(idx<0||!pg)return;
    const meeting=records[idx];
    const mod=pg.items.find(i=>i._id===meeting.moduleId);
    if(!mod)return;

    const patch={};
    changes.forEach(c=>{
      if(c.id==='status') patch.status=c.value;
      if(c.id==='pending') patch.pendingAt=c.value;
      if(c.id==='actions') patch.remarks=c.value;
      if(c.id==='target') patch.expectedCompletion=c.value;
      if(c.id==='responsible') patch.pendingWith=c.value;
    });
    patch.momHistory=Array.isArray(mod.momHistory)?mod.momHistory.slice():[];
    patch.momHistory.push({
      meetingId:meeting.meetingId,
      date:meeting.date,
      agenda:meeting.agenda,
      momSummary:meeting.momSummary||meeting.momText||'',
      decisions:meeting.decisions||'',
      actionItems:meeting.actionItems||'',
      pendingItems:meeting.pendingItems||'',
      latestUpdate:meeting.latestUpdate||'',
      updatedAt:new Date().toISOString()
    });
    EDITS[mod._id]=Object.assign({},EDITS[mod._id]||{},patch);

    records[idx]=Object.assign({},meeting,{
      momStatus:'MoM Updated',
      momUpdatedAt:new Date().toISOString()
    });
    saveMeetingHistory(gid,records);

    await saveEdits();
    await saveMeetings();
    closeMeetingFeatureModal('momReviewModal');
    buildData();
    render();
  }

    if(e.target.closest('[data-close-meeting-form]')){closeMeetingFeatureModal('meetingFormModal');return;}
    if(e.target.closest('[data-close-mom]')){closeMeetingFeatureModal('momReviewModal');return;}
    const save=e.target.closest('[data-save-meeting-form]');
    if(save){saveMeetingForm(save);return;}

    if(saveMom){saveMomAndReview(saveMom);return;}

  async function saveMomAndReview(btn){
    const gid=btn.getAttribute('data-save-mom'), meetingId=btn.getAttribute('data-meeting-id');
    const modal=document.getElementById('momReviewModal');
    const records=meetingHistory(gid).slice();
    const idx=records.findIndex(x=>(x.meetingId||'')===meetingId);
    if(idx<0)return;
    const m=records[idx];
    const text=modal.querySelector('[data-mom-field="momText"]')?.value.trim()||'';
    if(!text){alert('Please enter or upload the MoM.');return;}
    records[idx]=Object.assign({},m,{
      momText:text,
      momSource:modal.dataset.momSource||m.momSource||'',
      momSummary:text.slice(0,700),
      decisions:extractMeetingSection(text,['decisions','decision']),
      actionItems:extractMeetingSection(text,['action items','actions','next steps']),
      pendingItems:extractMeetingSection(text,['pending items','pending']),
      latestUpdate:extractMeetingSection(text,['latest update','module update','status update']),
      momStatus:'MoM Pending',
      momUpdatedAt:''
    });
    saveMeetingHistory(gid,records);
    await saveMeetings();
    openMomReview(gid,meetingId);
  }

  function extractMeetingSection(text, names){
    const re=new RegExp('(?:^|\\n)\\s*(?:'+names.join('|')+')\\s*:?\\s*\\n([\\s\\S]*?)(?=\\n\\s*[A-Za-z][A-Za-z /&-]{2,40}\\s*:?\\s*(?:\\n|$)|$)','i');
    const m=String(text||'').match(re);
    return m?m[1].trim():'';
  }

  function syncPgaLevelAssignments(){
    let changed=false;
    const pgaRegs=TEAM_STRUCTURE.pgaAssignments||{};
    Object.keys(pgaRegs).forEach(pgaId=>{
      const reg=pgaRegs[pgaId];
      if(!reg||reg.autoInclude!==true)return;
      const modules=allModules().filter(x=>x.gid===pgaId);
      (reg.officers||[]).forEach(officerId=>{
        modules.forEach(it=>{
          const cur=TEAM_STRUCTURE.assignments[it._id]?.current;
          if(!cur || !cur.swiftOfficerId){
            const next=Object.assign({},cur||{}, {swiftOfficerId:officerId, pgaAssignment:true, pgaAssignmentId:pgaId, assignmentType:'PGA-level', assignedAt:new Date().toISOString()});
            TEAM_STRUCTURE.assignments[it._id]={current:next,history:Array.isArray(TEAM_STRUCTURE.assignments[it._id]?.history)?TEAM_STRUCTURE.assignments[it._id].history:[]};
            syncAssignmentToModule(it._id,next); changed=true;
          }
        });
      });
    });
    if(changed){ assignmentsSave(); saveEdits(); }
    return changed;
  }
  function pgaAssignmentInfo(pgaId, officerId){
    const reg=TEAM_STRUCTURE.pgaAssignments?.[pgaId];
    return reg && Array.isArray(reg.officers) && reg.officers.includes(officerId) ? reg : null;
  }
  function unassignedPgaModules(pgaId, officerId){
    const reg=pgaAssignmentInfo(pgaId,officerId);
    if(!reg)return [];
    return allModules().filter(it=>it.gid===pgaId && assignmentForModule(it).swiftOfficerId!==officerId);
  }
  async function recordPgaLevelAssignment(pgaId, officerId, moduleIds, autoInclude){
    TEAM_STRUCTURE.pgaAssignments=TEAM_STRUCTURE.pgaAssignments||{};
    const reg=TEAM_STRUCTURE.pgaAssignments[pgaId]||{pgaId,officers:[],autoInclude:false,history:[]};
    if(!Array.isArray(reg.officers))reg.officers=[];
    if(!reg.officers.includes(officerId))reg.officers.push(officerId);
    reg.autoInclude=autoInclude===true;
    reg.history=Array.isArray(reg.history)?reg.history:[];
    reg.history.unshift({assignmentType:'PGA-level',pgaId,officerId,moduleIds:moduleIds.slice(),autoInclude:reg.autoInclude,assignedAt:new Date().toISOString(),assignedBy:'Current User'});
    TEAM_STRUCTURE.pgaAssignments[pgaId]=reg;
    await teamSave();
  }

    rec.history=Array.isArray(rec.history)?rec.history:[];
    rec.history.unshift(Object.assign({changedAt:new Date().toISOString()},entry));
    TEAM_STRUCTURE.assignments[moduleId]=rec;
  }

var pgaTaskListState = window.__pgaTaskListState || {

};

function pgaTaskEsc(v){ return typeof esc === 'function' ? esc(String(v ?? '')) : String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pgaTaskFmtDate(v){
  if(!v) return '—';
  const d=new Date(v); if(isNaN(d.getTime())) return pgaTaskEsc(v);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function pgaTaskDateValue(v){ return v ? String(v).slice(0,10) : ''; }
function pgaTaskDaysLeft(v){
  if(!v) return null; const d=new Date(v); if(isNaN(d.getTime())) return null;
  const today=new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.round((d-today)/86400000);
}
function pgaTaskStatusText(it){ return String(it?.status || 'Not Specified').trim(); }
function pgaTaskCategory(it,a,overrideType){
  if(overrideType==='Scheduled') return 'Scheduled';
  if(isCompleted(it)) return 'Completed';
  if(isOverdue(it,a)) return 'Overdue';
  if((a?.pendingWith||it?.pendingWith||it?.pendingAt)) return 'Pending';
  const s=pgaTaskStatusText(it).toLowerCase();
  const start=a?.plannedStartDate||it?.plannedStartDate||'';
  if(start && new Date(start)>new Date()) return 'Planned';
  if(s.includes('not started')||s.includes('discussion')||s.includes('planned')) return 'Planned';
  return 'Running';
}
function pgaTaskTypeForModule(it){
  const s=pgaTaskStatusText(it).toLowerCase();
  if(s.includes('discussion')) return 'Requirement Discussion';
  if(s.includes('development') || s.includes('api') || s.includes('integration')) return 'Development / Integration';
  if(s.includes('testing') || s.includes('test') || s.includes('vapt') || s.includes('uat')) return 'Testing / Validation';
  if(s.includes('deploy')) return 'Deployment';
  if(s.includes('complete')) return 'Completion / Review';
  return 'Module Activity';
}
function pgaTaskAssignedLabel(a,it){
  const ids=[a?.developerId,a?.testerId,a?.teamLeadId,a?.swiftOfficerId];
  for(const id of ids){ if(id){ const p=personById(id); if(p) return p.name; } }
  return a?.pendingWith || it?.pendingWith || 'Unassigned';
}
function pgaTaskChain(a,it){
  return `${it?.pga||'PGA'} → ${it?.type||'Module'} → ${personName(a?.swiftOfficerId)||'SWIFT Officer'} → ${personName(a?.teamLeadId)||'Infosys Lead'} → ${personName(a?.developerId)||'Developer'} → ${personName(a?.testerId)||'Tester'}`;
}
function pgaTaskMeetings(){
  const rows=[];
  Object.keys(MEETINGS||{}).forEach(gid=>{
    const pg=PGA_INDEX.find(x=>x.gid===gid); if(!pg) return;
    const hist=typeof meetingHistory==='function'?meetingHistory(gid):(MEETINGS[gid]?[MEETINGS[gid]]:[]);
    hist.forEach(m=>{
      if(!m) return;
      const date=m.date||m.meetingDate||'';
      const module=pg.items.find(it=>it._id===m.moduleId);
      const st=String(m.status||'Scheduled');
      if(st!=='Scheduled' && st!=='Meeting Scheduled' && st!=='Upcoming') return;
      rows.push({
        id:`meeting:${gid}:${m.meetingId||m.id||date||Math.random()}`,
        pga:pg.pga,gid,moduleId:m.moduleId||module?._id||'',module:module?.type||m.moduleName||'PGA-level Meeting',
        activity:m.title||'Review Meeting',category:'Scheduled',type:'Scheduled Meeting',assigned:m.participants||'Participants',status:st,
        priority:'—',planned:date,target:'',pending:'—',meeting:m

function pgaTaskBuildRows(){
  buildDataWithCustomModules();
  syncPgaLevelAssignments();
  const rows=[];
  allModules().forEach(it=>{
    const a=assignmentForModule(it)||{};
    const start=a.plannedStartDate||it.plannedStartDate||'';
    const target=a.targetDate||it.targetDate||it.expectedCompletion||'';
    const assigned=pgaTaskAssignedLabel(a,it);
    const base={pga:it.pga,gid:it.gid,moduleId:it._id,module:it.type||'Untitled Module',priority:a.priority||it.priority||'Medium',planned:start,target,pending:a.pendingWith||it.pendingWith||it.pendingAt||'—',status:pgaTaskStatusText(it),it,a};
    rows.push(Object.assign({},base,{id:`module:${it._id}`,activity:pgaTaskTypeForModule(it),category:pgaTaskCategory(it,a),type:pgaTaskTypeForModule(it),assigned}));
    if(base.pending!=='—'){
      rows.push(Object.assign({},base,{id:`pending:${it._id}`,activity:'Pending Action',category:'Pending',type:'Pending Action',assigned:base.pending,planned:start,target}));
    }

function pgaTaskInDateRange(row){
  const d=pgaTaskDateValue(row.planned||row.target||row.meeting?.date||'');
  if(pgaTaskListState.from && d && d<pgaTaskListState.from) return false;
  if(pgaTaskListState.to && d && d>pgaTaskListState.to) return false;
  if((pgaTaskListState.from||pgaTaskListState.to) && !d) return false;
  return true;
}
function pgaTaskFilterRows(rows){
  const q=String(pgaTaskListState.search||'').trim().toLowerCase();
  return rows.filter(r=>{
    if(pgaTaskListState.pga && r.gid!==pgaTaskListState.pga) return false;
    if(pgaTaskListState.module && r.moduleId!==pgaTaskListState.module) return false;
    if(pgaTaskListState.status && r.category!==pgaTaskListState.status && r.status!==pgaTaskListState.status) return false;
    if(pgaTaskListState.type && r.type!==pgaTaskListState.type) return false;
    if(pgaTaskListState.assigned && r.assigned!==pgaTaskListState.assigned) return false;
    if(pgaTaskListState.priority && r.priority!==pgaTaskListState.priority) return false;
    if(!pgaTaskInDateRange(r)) return false;
    if(q){ const hay=[r.activity,r.module,r.pga,r.assigned,r.status,r.category,r.type,r.pending].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

      ${rows.length?rows.map(r=>{const days=pgaTaskDaysLeft(r.target);const dueClass=days===0?'pga-task-due-today':'';return `<div class="pga-task-row ${dueClass}">
        <div class="pga-task-cell"><b>${pgaTaskEsc(r.activity)}</b><span>${pgaTaskEsc(r.type)}</span></div>
        <div class="pga-task-cell"><b>${pgaTaskEsc(r.module)}</b><span>${pgaTaskEsc(r.pga)}</span></div>
        <div class="pga-task-cell"><b>${pgaTaskEsc(r.assigned)}</b><span>${r.category==='Scheduled'?'Participants / Team':'Responsible'}</span></div>
        <div class="pga-task-cell">${pgaTaskBadge(r.category)}<span>${pgaTaskEsc(r.status||'—')}</span></div>
        <div class="pga-task-cell"><b>${pgaTaskFmtDate(r.planned)}</b><span>Planned Date</span></div>
        <div class="pga-task-cell"><b>${pgaTaskFmtDate(r.target)}</b><span>${days!==null?(days<0?`${Math.abs(days)}d overdue`:days===0?'Due today':`${days}d left`):'Target Date'}</span></div>
        <div class="pga-task-cell"><b>${pgaTaskEsc(r.pending||'—')}</b><span>Pending With</span></div>
      </div>`}).join(''):'<div class="pga-task-empty">No activities for this module under the current filters.</div>'}
    </div>

}
function renderKanbanDashboard(){
  const root=document.getElementById('kanbanView'); if(!root)return;
  const allRows=pgaTaskBuildRows();
  const rows=pgaTaskFilterRows(allRows);
  const moduleMap=new Map(allModules().map(m=>[m._id,m]));
  const byPga=new Map();
  rows.forEach(r=>{if(!byPga.has(r.gid))byPga.set(r.gid,{pga:r.pga,gid:r.gid,rows:[]});byPga.get(r.gid).rows.push(r);});
  const pgaOrder=PGA_INDEX.map(p=>p.gid).filter(g=>byPga.has(g));
  const summary={Running:0,Scheduled:0,Planned:0,Overdue:0,Completed:0}; rows.forEach(r=>{if(summary[r.category]!==undefined)summary[r.category]++;});
  const uniquePgas=[...new Map(PGA_INDEX.map(p=>[p.gid,p.pga])).entries()];
  const availableModules=allModules().filter(m=>!pgaTaskListState.pga||m.gid===pgaTaskListState.pga);

  const types=[...new Set(allRows.map(r=>r.type).filter(Boolean))].sort();

    <div class="pga-task-summary">
      <div class="pga-task-kpi running"><strong>${summary.Running}</strong><span>Running Tasks</span></div>
      <div class="pga-task-kpi scheduled"><strong>${summary.Scheduled}</strong><span>Meetings Scheduled</span></div>
      <div class="pga-task-kpi planned"><strong>${summary.Planned}</strong><span>Planned Tasks</span></div>
      <div class="pga-task-kpi overdue"><strong>${summary.Overdue}</strong><span>Overdue</span></div>
      <div class="pga-task-kpi completed"><strong>${summary.Completed}</strong><span>Completed</span></div>
    </div>
    <div class="pga-task-filters">
      <input class="pga-task-filter-search" data-tf="search" value="${pgaTaskEsc(pgaTaskListState.search)}" placeholder="Search PGA, module, activity, person or pending work…">
      <select data-tf="pga"><option value="">All PGAs</option>${uniquePgas.map(([id,n])=>`<option value="${pgaTaskEsc(id)}" ${pgaTaskListState.pga===id?'selected':''}>${pgaTaskEsc(n)}</option>`).join('')}</select>
      <select data-tf="module"><option value="">All Modules</option>${availableModules.map(m=>`<option value="${pgaTaskEsc(m._id)}" ${pgaTaskListState.module===m._id?'selected':''}>${pgaTaskEsc(m.type||'Untitled Module')}</option>`).join('')}</select>
      <select data-tf="status"><option value="">All Task Status</option>${statusOptions.map(x=>`<option ${pgaTaskListState.status===x?'selected':''}>${x}</option>`).join('')}</select>
      <select data-tf="type"><option value="">All Task Types</option>${types.map(x=>`<option value="${pgaTaskEsc(x)}" ${pgaTaskListState.type===x?'selected':''}>${pgaTaskEsc(x)}</option>`).join('')}</select>
      <select data-tf="assigned"><option value="">All Assigned People / Teams</option>${assigned.map(x=>`<option value="${pgaTaskEsc(x)}" ${pgaTaskListState.assigned===x?'selected':''}>${pgaTaskEsc(x)}</option>`).join('')}</select>
      <select data-tf="priority"><option value="">All Priorities</option>${['Critical','High','Medium','Low'].map(x=>`<option ${pgaTaskListState.priority===x?'selected':''}>${x}</option>`).join('')}</select>
      <div class="pga-task-date"><input type="date" data-tf="from" value="${pgaTaskEsc(pgaTaskListState.from)}" title="From date"><input type="date" data-tf="to" value="${pgaTaskEsc(pgaTaskListState.to)}" title="To date"></div>
      <button type="button" class="pga-task-reset" data-task-reset>Reset Filters</button>
    </div>
    <div class="pga-task-tree">
      ${pgaOrder.map(gid=>{const g=byPga.get(gid),open=pgaTaskListOpenPgas.has(gid);const moduleIds=[...new Set(g.rows.map(r=>r.moduleId).filter(Boolean))];const groups=moduleIds.map(mid=>{const m=moduleMap.get(mid);return m?{m,rows:g.rows.filter(r=>r.moduleId===mid)}:null}).filter(Boolean);return `<section class="pga-task-pga ${open?'open':''}" data-task-pga="${pgaTaskEsc(gid)}"><div class="pga-task-pga-head"><span class="pga-task-chevron">›</span><div class="pga-task-pga-name">${pgaTaskEsc(g.pga)}</div><div class="pga-task-pga-meta"><span class="pga-task-pill">${groups.length} modules</span><span class="pga-task-pill running">${g.rows.filter(r=>r.category==='Running').length} running</span><span class="pga-task-pill scheduled">${g.rows.filter(r=>r.category==='Scheduled').length} meetings</span><span class="pga-task-pill overdue">${g.rows.filter(r=>r.category==='Overdue').length} overdue</span></div></div><div class="pga-task-pga-body">${groups.length?groups.map(x=>pgaTaskModuleGroupHtml(x.m,x.rows)).join(''):'<div class="pga-task-empty">No modules match the current filters.</div>'}</div></section>`;}).join('') || '<div class="pga-task-empty">No activities match the current filters.</div>'}

  root.querySelectorAll('[data-task-pga]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-task-module]'))return;const id=el.getAttribute('data-task-pga');if(pgaTaskListOpenPgas.has(id))pgaTaskListOpenPgas.delete(id);else pgaTaskListOpenPgas.add(id);renderKanbanDashboard();}));

  root.querySelector('[data-tf="search"]')?.addEventListener('input',e=>{pgaTaskListState.search=e.target.value;clearTimeout(window.__pgaTaskSearchTimer);window.__pgaTaskSearchTimer=setTimeout(renderKanbanDashboard,180);});
  root.querySelector('[data-task-reset]')?.addEventListener('click',()=>{Object.assign(pgaTaskListState,{search:'',pga:'',module:'',status:'',type:'',assigned:'',priority:'',from:'',to:''});renderKanbanDashboard();});
}


// Final deterministic Task Board activation (runs after all legacy handlers).
(function(){
  const tab=document.getElementById('viewTabs')?.querySelector('[data-view="kanban"]');
  if(!tab)return;
  tab.addEventListener('click',()=>setTimeout(()=>{
    try{
      state.view='kanban';
      document.querySelectorAll('.view-tab').forEach(x=>x.classList.toggle('active',x===tab));
      const main=document.getElementById('main'), task=document.getElementById('kanbanView'), team=document.getElementById('teamStructureView');

      if(team)team.style.display='none';

      console.error('Task List activation error:',err);
      const task=document.getElementById('kanbanView');
      if(task) task.innerHTML='<div style="padding:30px;color:#E8F0F5">PGA Task List could not be rendered. Please reload the page.</div>';
    }
  },10));
})();

})();

<script id="pga-week-monitor-script">
(function(){
  const S=window.__pgaTaskListState||(window.__pgaTaskListState={search:'',pga:'',module:'',status:'',type:'',assigned:'',priority:'',from:'',to:'',swiftId:'',leadId:'',function:''}); if(S.swiftId===undefined)S.swiftId=''; if(S.leadId===undefined)S.leadId=''; if(S.function===undefined)S.function='';
  const openSet=window.__pgaTaskListOpenPgas||(window.__pgaTaskListOpenPgas=new Set());
  const DAY=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const pad=n=>String(n).padStart(2,'0');
  const localDate=(d)=>{const x=new Date(d); return new Date(x.getFullYear(),x.getMonth(),x.getDate());};
  const iso=(d)=>{const x=localDate(d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;};
  const monday=(d)=>{const x=localDate(d), day=x.getDay()||7; x.setDate(x.getDate()-day+1); return x;};
  const sunday=(d)=>{const x=monday(d);x.setDate(x.getDate()+6);return x;};
  const weekLabel=(a,b)=>`${a.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} – ${b.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`;
  const state={offset:0,from:'',to:'',showAll:false,dayView:true};
  window.__pgaWeekState=state;
  const esc=v=>typeof pgaTaskEsc==='function'?pgaTaskEsc(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
  const daysLeft=d=>{if(!d)return null;const t=localDate(new Date()),x=localDate(new Date(d));return Math.round((x-t)/86400000)};
  function range(){ if(state.from||state.to){return {from:state.from?new Date(state.from):new Date(),to:state.to?new Date(state.to):new Date()};} const a=monday(new Date());a.setDate(a.getDate()+state.offset*7);const b=new Date(a);b.setDate(b.getDate()+6);return {from:a,to:b}; }
  function rowCategory(it,a,date,explicit){
    if(explicit==='Scheduled') return 'Scheduled';

    if(isCompleted(it)) return 'Completed';
    if(dl!==null&&dl<0) return 'Overdue';
    if(a?.pendingWith||it?.pendingWith||it?.pendingAt) return 'Pending';
    if(s.includes('discussion')||s.includes('not started')||s.includes('planned')) return 'Planned';
    return 'Running';
  }
  function moduleRows(it){
    const a=(typeof assignmentForModule==='function'?assignmentForModule(it):{})||{};
    const start=a.plannedStartDate||it.plannedStartDate||'';
    const target=a.targetDate||it.targetDate||it.expectedCompletion||'';
    const st=String(it.status||'Not Specified'); const cat=rowCategory(it,a);

    add(start,type,st,cat,type);
    if(target&&target!==start) add(target,'Target / Completion',st,cat,'Target');
    if(a.remarks && (start||target)) add(start||target,'Work Allocation / Review',st,cat,'Work Allocation');
    if((a.developerId||a.testerId||a.teamLeadId)&& (start||target)){
      if(a.developerId) add(start||target,'Development Activity',st,cat,'Development');
      if(a.testerId) add(target||start,'Testing / Validation',st,cat,'Testing');
    }
    return out;
  }
  function meetingRows(){
    const out=[];const meetings=window.MEETINGS||{};Object.keys(meetings).forEach(gid=>{
      const pg=(window.PGA_INDEX||[]).find(x=>x.gid===gid);if(!pg)return;
      const hist=typeof meetingHistory==='function'?meetingHistory(gid):(meetings[gid]?[meetings[gid]]:[]);
      hist.forEach(m=>{const date=m?.date||m?.meetingDate||'';if(!date)return;const status=String(m.status||'Scheduled');if(!['Scheduled','Meeting Scheduled','Upcoming'].includes(status))return;const mod=pg.items.find(x=>x._id===m.moduleId);out.push({id:`meeting:${gid}:${m.meetingId||m.id||date}`,gid,moduleId:m.moduleId||mod?._id||'',pga:pg.pga,module:mod?.type||m.moduleName||'PGA-level Meeting',activity:m.title||'Review Meeting',type:'Scheduled Meeting',assigned:m.participants||'Participants',status,priority:m.priority||'Medium',planned:date,target:'',pending:'—',category:'Scheduled',it:mod||{},meeting:m});});
    });return out;
  }
  function buildAll(){ if(typeof buildDataWithCustomModules==='function')buildDataWithCustomModules();if(typeof syncPgaLevelAssignments==='function')syncPgaLevelAssignments();let rows=[];const mods=typeof allModules==='function'?allModules():[];mods.forEach(it=>rows=rows.concat(moduleRows(it)));return rows.concat(meetingRows()); }
  function inRange(r,rg){const d=String(r.planned||r.target||r.meeting?.date||'').slice(0,10);if(!d)return false;const lo=iso(rg.from),hi=iso(rg.to);if(d>=lo&&d<=hi)return true;const active=!['Completed','Scheduled'].includes(r.category);const target=String(r.target||'').slice(0,10);return active&&r.category==='Overdue'&&target&&target<lo;}
  function filter(rows){return rows.filter(r=>{const q=String(S.search||'').trim().toLowerCase();if(S.pga&&r.gid!==S.pga)return false;if(S.module&&r.moduleId!==S.module)return false;if(S.status&&(r.category!==S.status&&r.status!==S.status))return false;if(S.assigned&&r.assigned!==S.assigned)return false;if(S.priority&&r.priority!==S.priority)return false; if(S.swiftId&&String((r.a&&r.a.swiftOfficerId)||'')!==S.swiftId)return false; if(S.leadId&&String((r.a&&r.a.teamLeadId)||'')!==S.leadId)return false; if(S.function&&String(r.type||'').toLowerCase().includes(S.function.toLowerCase())===false && !(S.function==='Testing' && /test|vapt|uat/i.test(r.activity+' '+r.type)) && !(S.function==='Development' && /develop|api|integration/i.test(r.activity+' '+r.type)))return false;if(!inRange(r,range()))return false;if(q&&!([r.activity,r.module,r.pga,r.assigned,r.status,r.category,r.type,r.pending].join(' ').toLowerCase().includes(q)))return false;return true;});}
  function unique(list){return [...new Set(list.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));}
  function chain(r){const a=r.a||{};return `${r.pga} → ${r.module} → ${(typeof personName==='function'?personName(a.swiftOfficerId):'')||'SWIFT Officer'} → ${(typeof personName==='function'?personName(a.teamLeadId):'')||'Infosys Lead'} → ${(typeof personName==='function'?personName(a.developerId):'')||'Developer'} → ${(typeof personName==='function'?personName(a.testerId):'')||'Tester'}`;}
  function badge(cat){return `<span class="pga-week-badge ${String(cat).toLowerCase().replace(/\s+/g,' ')}">${esc(cat)}</span>`}
  function render(){
    const root=document.getElementById('kanbanView');if(!root)return;
    const all=buildAll(); const rows=filter(all); const rg=range();
    const pgas=[...(window.PGA_INDEX||[])]; const byPga=new Map();rows.forEach(r=>{if(!byPga.has(r.gid))byPga.set(r.gid,{gid:r.gid,pga:r.pga,rows:[]});byPga.get(r.gid).rows.push(r);});
    const pgaOrder=pgas.map(p=>p.gid).filter(g=>byPga.has(g));
    const counts={total:rows.length,running:0,planned:0,meetings:0,completed:0,overdue:0};rows.forEach(r=>{if(r.category==='Running')counts.running++;if(r.category==='Planned')counts.planned++;if(r.category==='Scheduled')counts.meetings++;if(r.category==='Completed')counts.completed++;if(r.category==='Overdue')counts.overdue++;});
    const mods=typeof allModules==='function'?allModules():[];const allowedMods=mods.filter(m=>!S.pga||m.gid===S.pga);const assigned=unique(all.map(r=>r.assigned));const swiftPeople=unique(all.map(r=>r.a?.swiftOfficerId).map(id=>typeof personName==='function'?personName(id):'').filter(Boolean));const leadPeople=unique(all.map(r=>r.a?.teamLeadId).map(id=>typeof personName==='function'?personName(id):'').filter(Boolean));const swiftByName=Object.fromEntries(swiftPeople.map(name=>[name,(all.find(r=>typeof personName==='function'&&personName(r.a?.swiftOfficerId)===name)||{}).a?.swiftOfficerId||'']));const leadByName=Object.fromEntries(leadPeople.map(name=>[name,(all.find(r=>typeof personName==='function'&&personName(r.a?.teamLeadId)===name)||{}).a?.teamLeadId||'']));
    const fromVal=state.from||''; const toVal=state.to||'';
    root.innerHTML=`<div class="pga-week-monitor">
      <div class="pga-week-head"><div><h2 class="pga-week-title">PGA Task List</h2><p class="pga-week-sub">Current week task monitoring dashboard — what is planned, running, completed, pending and due.</p></div><div class="pga-week-nav"><button type="button" data-week-nav="prev">← Previous Week</button><button type="button" data-week-nav="current" class="${state.offset===0&&!state.from&&!state.to?'active':''}">Current Week</button><button type="button" data-week-nav="next">Next Week →</button></div></div>
      <div class="pga-week-date-row"><div class="pga-week-range">${esc(weekLabel(rg.from,rg.to))}</div><div class="pga-week-range-note">Monday to Sunday · ${rows.length} activities in selected period</div></div>
      <div class="pga-week-kpis"><div class="pga-week-kpi total"><strong>${counts.total}</strong><span>Total Tasks</span></div><div class="pga-week-kpi running"><strong>${counts.running}</strong><span>In Progress</span></div><div class="pga-week-kpi planned"><strong>${counts.planned}</strong><span>Planned</span></div><div class="pga-week-kpi meetings"><strong>${counts.meetings}</strong><span>Meetings</span></div><div class="pga-week-kpi completed"><strong>${counts.completed}</strong><span>Completed</span></div><div class="pga-week-kpi overdue"><strong>${counts.overdue}</strong><span>Overdue</span></div></div>
      <div class="pga-week-filters">
        <input class="wide" data-wf="search" value="${esc(S.search||'')}" placeholder="Search PGA, module, activity, officer, lead or pending work…">
        <select data-wf="pga"><option value="">All PGAs</option>${pgas.map(p=>`<option value="${esc(p.gid)}" ${S.pga===p.gid?'selected':''}>${esc(p.pga)}</option>`).join('')}</select>
        <select data-wf="module"><option value="">All Modules</option>${allowedMods.map(m=>`<option value="${esc(m._id)}" ${S.module===m._id?'selected':''}>${esc(m.type||'Untitled Module')}</option>`).join('')}</select>
        <select data-wf="assigned"><option value="">All Assigned People / Teams</option>${assigned.map(x=>`<option ${S.assigned===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
        <select data-wf="status"><option value="">All Statuses</option>${['Running','Planned','Scheduled','Completed','Pending','Overdue'].map(x=>`<option ${S.status===x?'selected':''}>${x}</option>`).join('')}</select>
        <select data-wf="priority"><option value="">All Priorities</option>${['Critical','High','Medium','Low'].map(x=>`<option ${S.priority===x?'selected':''}>${x}</option>`).join('')}</select>
        <select data-wf="swiftName"><option value="">All SWIFT Officers</option>${swiftPeople.map(x=>`<option value="${esc(swiftByName[x])}" ${S.swiftId===swiftByName[x]?'selected':''}>${esc(x)}</option>`).join('')}</select>
        <select data-wf="leadId"><option value="">All Infosys Leads</option>${leadPeople.map(x=>`<option value="${esc(leadByName[x])}" ${S.leadId===leadByName[x]?'selected':''}>${esc(x)}</option>`).join('')}</select>
        <select data-wf="function"><option value="">Development / Testing</option><option value="Development">Development</option><option value="Testing">Testing</option></select>
        <div class="pga-week-date-filter"><input type="date" data-wrange="from" value="${esc(fromVal)}" title="Start date"><input type="date" data-wrange="to" value="${esc(toVal)}" title="End date"></div>
        <button type="button" class="pga-week-reset" data-week-reset>Reset</button>
      </div>
      <div class="pga-week-options"><label><input type="checkbox" data-show-all ${state.showAll?'checked':''}> Show All Modules</label><label><input type="checkbox" data-day-view ${state.dayView?'checked':''}> Day-wise Breakdown</label><span class="pga-week-range-note">Modules without activity in the selected period remain hidden unless “Show All Modules” is enabled.</span></div>
      ${state.dayView?dayView(rows,rg):''}
      <div class="pga-week-tree">${renderTree(rows,mods,pgaOrder,byPga)}</div>
    </div>`;
    bind(root); window.__pgaWeekLastRows=rows;
  }
  function dayView(rows,rg){const cells=[];for(let i=0;i<7;i++){const d=new Date(rg.from);d.setDate(d.getDate()+i);const ds=iso(d);const rs=rows.filter(r=>String(r.planned||r.target||r.meeting?.date||'').slice(0,10)===ds);cells.push(`<div class="pga-week-daybreak"><strong>${DAY[i]} · ${d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</strong><span>${rs.length} ${rs.length===1?'activity':'activities'}</span></div>${rs.length?`<div class="pga-week-day-items">${rs.map(r=>`<div class="pga-week-day-item"><b>${fmt(r.planned||r.meeting?.date||r.target)}</b><div><b>${esc(r.activity)}</b><span>${esc(r.pga)} → ${esc(r.module)} · ${esc(r.assigned)}</span></div>${badge(r.category)}</div>`).join('')}</div>`:'<div class="pga-week-empty">No planned activity.</div>'}`);}return `<div>${cells.join('')}</div>`;}
  function renderTree(rows,mods,pgaOrder,byPga){
    const modMap=new Map(mods.map(m=>[m._id,m])); let html='';
    pgaOrder.forEach(gid=>{const g=byPga.get(gid);const groups=[...new Set(g.rows.map(r=>r.moduleId).filter(Boolean))].map(id=>({m:modMap.get(id),rows:g.rows.filter(r=>r.moduleId===id)})).filter(x=>x.m);if(state.showAll){mods.filter(m=>m.gid===gid&&!groups.some(x=>x.m._id===m._id)).forEach(m=>groups.push({m,rows:[]}));}const open=openSet.has(gid);html+=`<section class="pga-week-pga ${open?'open':''}" data-week-pga="${esc(gid)}"><div class="pga-week-pga-head"><span class="pga-week-chevron">›</span><div class="pga-week-pga-name">${esc(g.pga)}</div><div class="pga-week-pga-meta"><span class="pga-week-pill">${groups.length} modules</span><span class="pga-week-pill running">${g.rows.filter(r=>r.category==='Running').length} running</span><span class="pga-week-pill meeting">${g.rows.filter(r=>r.category==='Scheduled').length} meetings</span><span class="pga-week-pill overdue">${g.rows.filter(r=>r.category==='Overdue').length} overdue</span></div></div><div class="pga-week-pga-body">${groups.length?groups.map(x=>moduleHtml(x.m,x.rows)).join(''):'<div class="pga-week-empty">No modules with activity in the selected period.</div>'}</div></section>`;});
    if(!html)html='<div class="pga-week-empty">No activities found for the selected period. Try another week, date range, or enable “Show All Modules”.</div>';return html;
  }
  function moduleHtml(m,rows){const a=typeof assignmentForModule==='function'?assignmentForModule(m)||{}:{};const cats=['Running','Planned','Scheduled','Completed','Pending','Overdue'];const counts=Object.fromEntries(cats.map(c=>[c,rows.filter(r=>r.category===c).length]));const b=[];cats.forEach(c=>{if(counts[c])b.push(`<span class="pga-week-pill ${c.toLowerCase()}">${c} ${counts[c]}</span>`)});if(!rows.length)b.push('<span class="pga-week-pill">No activity</span>');return `<div class="pga-week-module"><div class="pga-week-module-head" data-week-module="${esc(m._id)}"><div class="pga-week-module-info"><div class="pga-week-module-name">${esc(m.type||'Untitled Module')}</div><div class="pga-week-module-chain">${esc(chain({pga:m.pga,module:m.type||'Module',a}))}</div></div><div class="pga-week-module-badges">${b.join('')}</div></div>${rows.length?`<div class="pga-week-activity-head"><div>Date</div><div>Task / Activity</div><div>Assigned To</div><div>Status</div><div>Priority</div><div>Target</div><div>Pending With</div></div>${rows.map(r=>`<div class="pga-week-activity"><div class="pga-week-cell"><b>${fmt(r.planned||r.meeting?.date||r.target)}</b><span>${r.meeting?.time?esc(r.meeting.time):''}</span></div><div class="pga-week-cell"><b>${esc(r.activity)}</b><span>${esc(r.type)}</span></div><div class="pga-week-cell"><b>${esc(r.assigned||'Unassigned')}</b><span>${r.category==='Scheduled'?'Participants':'Responsible'}</span></div><div class="pga-week-cell">${badge(r.category)}<span>${esc(r.status||'—')}</span></div><div class="pga-week-cell"><b>${esc(r.priority||'—')}</b><span>Priority</span></div><div class="pga-week-cell"><b>${fmt(r.target)}</b><span>${daysLeft(r.target)!==null?(daysLeft(r.target)<0?Math.abs(daysLeft(r.target))+'d overdue':daysLeft(r.target)===0?'Due today':daysLeft(r.target)+'d left'):''}</span></div><div class="pga-week-cell"><b>${esc(r.pending||'—')}</b><span>Pending With</span></div></div>`).join('')}`:'<div class="pga-week-empty">No activity in this period. Module is shown because “Show All Modules” is enabled.</div>'}</div>`;}
  function bind(root){
    root.querySelectorAll('[data-week-nav]').forEach(b=>b.addEventListener('click',()=>{const k=b.getAttribute('data-week-nav');if(k==='prev'){state.offset-=1;state.from='';state.to='';}else if(k==='next'){state.offset+=1;state.from='';state.to='';}else{state.offset=0;state.from='';state.to='';}render();}));
    root.querySelectorAll('[data-wf]').forEach(el=>el.addEventListener('change',()=>{const k=el.getAttribute('data-wf');S[k]=el.value;if(k==='pga'&&S.module&&!((typeof allModules==='function'?allModules():[]).some(m=>m._id===S.module&&m.gid===S.pga)))S.module='';if(k==='swiftName')S.swiftId=el.value;if(k==='leadId')S.leadId=el.value;render();}));
    root.querySelector('[data-wf="search"]')?.addEventListener('input',e=>{S.search=e.target.value;clearTimeout(window.__pgaWeekSearchTimer);window.__pgaWeekSearchTimer=setTimeout(render,150);});
    root.querySelectorAll('[data-wrange]').forEach(el=>el.addEventListener('change',()=>{state[el.getAttribute('data-wrange')]=el.value;state.offset=0;render();}));
    root.querySelector('[data-week-reset]')?.addEventListener('click',()=>{Object.assign(S,{search:'',pga:'',module:'',status:'',assigned:'',priority:'',type:'',swiftId:'',leadId:'',function:''});state.offset=0;state.from='';state.to='';render();});
    root.querySelector('[data-show-all]')?.addEventListener('change',e=>{state.showAll=e.target.checked;render();});
    root.querySelector('[data-day-view]')?.addEventListener('change',e=>{state.dayView=e.target.checked;render();});
    root.querySelectorAll('[data-week-pga]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-week-module]'))return;const id=el.getAttribute('data-week-pga');openSet.has(id)?openSet.delete(id):openSet.add(id);render();}));
    root.querySelectorAll('[data-week-module]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const id=el.getAttribute('data-week-module');const m=(typeof allModules==='function'?allModules():[]).find(x=>x._id===id);if(m&&typeof openModuleEditor==='function')openModuleEditor(id,m.gid);}));
  }
  // SWIFT Officer / Infosys Lead filters are applied by augmenting the search criteria without changing the shared state model.
  const oldRender=window.renderKanbanDashboard;
  window.renderKanbanDashboard=render;
  window.__pgaRenderWeek=render;
  // Initial Task List render uses the current week but does not alter other application views.
  document.addEventListener('DOMContentLoaded',()=>{if((window.state?.view)==='kanban')setTimeout(render,30);});
})();
</script>
