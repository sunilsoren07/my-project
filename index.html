<script id="github-task-board-script">
(function(){
  const STORAGE='swift_pga_github_task_board_v1';
  const customKey='swift_pga_github_custom_tasks_v1';
  const safeEsc=v=>typeof pgaTaskEsc==='function'?pgaTaskEsc(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback));}catch(e){return fallback;}};
  const save=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}};
  let boardState=load(STORAGE,{});
  let customTasks=load(customKey,[]);
  let deletedTasks=load('swift_pga_github_deleted_tasks_v1',{});
  let collapsed={};
  let addingColumn=null;
  let editingId=null;

  function local(d){const x=new Date(d);return new Date(x.getFullYear(),x.getMonth(),x.getDate());}
  function iso(d){const x=local(d),p=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`;}
  function monday(d){const x=local(d),day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x;}
  function weekRange(){
    const a=monday(new Date());const b=new Date(a);b.setDate(b.getDate()+6);return {from:iso(a),to:iso(b)};
  }
  function dueText(date){
    if(!date)return '';
    const d=local(date),t=local(new Date()),diff=Math.round((d-t)/86400000);
    if(diff<0)return `${Math.abs(diff)}d overdue`;
    if(diff===0)return 'Due today';
    if(diff===1)return '1d left';
    return `${diff}d left`;
  }
  function defaultBucket(r){
    const c=String(r.category||'').toLowerCase();
    if(c==='completed')return 'done';
    if(c==='running'||c==='scheduled'||c==='overdue')return 'progress';
    return 'todo';
  }
  function currentRows(){
    let rows=[];
    try{if(typeof pgaTaskBuildRows==='function')rows=pgaTaskBuildRows();}catch(e){}
    const rg=weekRange();
    rows=rows.filter(r=>{
      const d=String(r.planned||r.target||r.meeting?.date||'').slice(0,10);
      if(!d)return false;
      if(d>=rg.from&&d<=rg.to)return true;
      return r.category==='Overdue' && r.target && String(r.target).slice(0,10)<rg.from;
    });
    return rows;
  }
  function getData(){
    const rows=currentRows();
    const map=new Map();
    rows.forEach(r=>{
      const id=String(r.id||`${r.moduleId}:${r.activity}:${r.planned}`);
      if(!map.has(id))map.set(id,{...r,_boardId:id,custom:false});
    });
    customTasks.forEach(t=>map.set(t._boardId,{...t,custom:true}));
    const out=[...map.values()].filter(r=>!deletedTasks[r._boardId]);
    out.forEach(r=>{
      if(!boardState[r._boardId])boardState[r._boardId]=defaultBucket(r);
    });
    save(STORAGE,boardState);
    return out;
  }
  function bucketRows(data,key){return data.filter(r=>(boardState[r._boardId]||defaultBucket(r))===key);}
  function dueClass(date){const txt=dueText(date);return txt.includes('overdue')?'overdue':txt==='Due today'?'today':'';}
  function card(r){
    const id=safeEsc(r._boardId), title=safeEsc(r.activity||r.type||'Task');
    const pga=safeEsc(r.pga||'');
    const module=safeEsc(r.module||'');
    const assigned=safeEsc(r.assigned||'Unassigned');
    const priority=String(r.priority||'').toLowerCase();
    const date=r.target||r.planned||r.meeting?.date||'';
    const due=safeEsc(dueText(date));
    const rawStatus=safeEsc(r.status||r.category||'');
    return `<article class="gh-card" draggable="true" data-gh-card="${id}">
      <div class="gh-card-top">
        <div class="gh-card-title">${title}</div>
        <div class="gh-card-actions">
          <button type="button" class="gh-card-action" data-gh-edit="${id}">Edit</button>
          <button type="button" class="gh-card-action delete" data-gh-delete="${id}">Delete</button>
        </div>
      </div>
      <div class="gh-card-meta">
        ${pga?`<span class="gh-chip pga">${pga}</span>`:''}
        ${module?`<span class="gh-chip">${module}</span>`:''}
        ${priority?`<span class="gh-chip priority-${safeEsc(priority)}">${safeEsc(r.priority)}</span>`:''}
      </div>
      ${r.description||r.desc?`<div class="gh-card-description"><b>Description:</b> ${safeEsc(r.description||r.desc)}</div>`:''}
      ${r.remarks||r.remark?`<div class="gh-card-remark"><b>Remark:</b> ${safeEsc(r.remarks||r.remark)}</div>`:''}
      <div class="gh-card-line"><b>Assigned:</b> ${assigned}</div>
      ${rawStatus?`<div class="gh-card-line"><b>Status:</b> ${rawStatus}</div>`:''}
      <div class="gh-card-footer"><span class="gh-task-status">${r.custom?'Board Task':safeEsc(r.type||r.category||'Task')}</span><span class="gh-due ${dueClass(date)}">${due||'No target date'}</span></div>
    </article>`;
  }
  function editForm(r){
    return `<div class="gh-add-form gh-edit-form" data-gh-edit-form="${safeEsc(r._boardId)}">
      <input data-gh-edit-title value="${safeEsc(r.activity||'')}" placeholder="Task title">
      <textarea data-gh-edit-desc placeholder="Task description">${safeEsc(r.description||r.desc||'')}</textarea>
      <textarea data-gh-edit-remark placeholder="Remark / latest update / next action">${safeEsc(r.remarks||r.remark||'')}</textarea>
      <select data-gh-edit-pga><option value="">PGA (optional)</option>${(window.PGA_INDEX||[]).map(p=>`<option value="${safeEsc(p.gid)}" ${p.gid===r.gid?'selected':''}>${safeEsc(p.pga)}</option>`).join('')}</select>
      <input type="date" data-gh-edit-date value="${safeEsc(r.target||r.planned||'')}" title="Target date">
      <div class="gh-add-actions">
        <button type="button" class="gh-cancel" data-gh-edit-cancel>Cancel</button>
        <button type="button" class="gh-save" data-gh-edit-save="${safeEsc(r._boardId)}">Save changes</button>
      </div>
    </div>`;
  }

  function addForm(bucket){
    const pgas=(window.PGA_INDEX||[]);
    return `<div class="gh-add-form" data-gh-form="${bucket}">
      <input data-gh-new-title placeholder="Task title" autofocus>
      <textarea data-gh-new-desc placeholder="Task description"></textarea>
      <textarea data-gh-new-remark placeholder="Remark / latest update / next action"></textarea>
      <select data-gh-new-pga><option value="">PGA (optional)</option>${pgas.map(p=>`<option value="${safeEsc(p.gid)}">${safeEsc(p.pga)}</option>`).join('')}</select>
      <input type="date" data-gh-new-date title="Target date">
      <div class="gh-add-actions"><button type="button" class="gh-cancel" data-gh-cancel>Cancel</button><button type="button" class="gh-save" data-gh-save="${bucket}">Create task</button></div>
    </div>`;
  }
  function render(){
    const root=document.getElementById('kanbanView');if(!root)return;
    const data=getData();
    const groups={todo:bucketRows(data,'todo'),progress:bucketRows(data,'progress'),done:bucketRows(data,'done')};
    const rg=weekRange();
    const total=data.length;
    root.innerHTML=`<div class="gh-board-wrap">
      <div class="gh-board-head">
        <div><h2 class="gh-board-title">PGA Task Board</h2><p class="gh-board-sub">Task board for the current week · ${safeEsc(rg.from)} to ${safeEsc(rg.to)} · Drag cards between columns.</p></div>
        <div class="gh-board-actions">
          <button type="button" class="gh-board-btn active" data-gh-current>Current Week</button>
          <button type="button" class="gh-board-btn" data-gh-refresh>↻ Refresh</button>
        </div>
      </div>
      <div class="gh-board">
        ${column('todo','Todo',"This item hasn't been started",groups.todo)}
        ${column('progress','In Progress','This is actively being worked on',groups.progress)}
        ${column('done','Done','This has been completed',groups.done)}
      </div>
      <div class="gh-board-note"><b>${total}</b> tasks shown from the current-week task list. Existing PGA/module activities are automatically placed by status; dragging changes the board position and is saved in this browser. Click ↗ on a card to open its module details.</div>
    </div>`;
    bind(root);
  }
  function column(key,title,desc,items){
    const isCollapsed=!!collapsed[key];
    return `<section class="gh-column ${key}" data-gh-column="${key}">
      <div class="gh-column-head">
        <span class="gh-status-dot"></span><span class="gh-column-title">${title}</span><span class="gh-column-count">${items.length}</span>
        <p class="gh-column-desc">${desc}</p>
        <div class="gh-head-actions">
          <button type="button" class="gh-icon-btn gh-add-card" data-gh-add="${key}" title="Add task">+</button>
          <div class="gh-menu"><button type="button" class="gh-icon-btn" data-gh-menu title="Column options">•••</button>
            <div class="gh-menu-panel">
              <button type="button" data-gh-collapse="${key}">${isCollapsed?'Expand column':'Collapse column'}</button>
              <button type="button" data-gh-clear="${key}">Clear board position</button>
            </div>
          </div>
        </div>
      </div>
      ${isCollapsed?'':`<div class="gh-column-body" data-gh-drop="${key}">
        ${addingColumn===key?addForm(key):''}
        ${items.length?items.map(r=>(editingId===r._boardId?editForm(r):card(r))).join(''):`<div class="gh-empty">No tasks in ${title}.<br>Drop a task here or use + to add one.</div>`}
      </div>`}
    </section>`;
  }
  function bind(root){
    root.querySelectorAll('[data-gh-add]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();addingColumn=b.dataset.ghAdd;render();setTimeout(()=>root.querySelector('[data-gh-form] input')?.focus(),0);}));
    root.querySelectorAll('[data-gh-cancel]').forEach(b=>b.addEventListener('click',()=>{addingColumn=null;render();}));
    root.querySelectorAll('[data-gh-save]').forEach(b=>b.addEventListener('click',()=>{
      const form=b.closest('[data-gh-form]');const title=form.querySelector('[data-gh-new-title]').value.trim();if(!title){form.querySelector('[data-gh-new-title]').focus();return;}
      const gid=form.querySelector('[data-gh-new-pga]').value;const pg=(window.PGA_INDEX||[]).find(x=>x.gid===gid);
      const date=form.querySelector('[data-gh-new-date]').value;
      const description=form.querySelector('[data-gh-new-desc]').value.trim();
      const remarks=form.querySelector('[data-gh-new-remark]').value.trim();
      const id=`custom:${Date.now()}`;
      customTasks.push({_boardId:id,id,pga:pg?.pga||'',gid,module:'',activity:title,description,desc:description,remarks,remark:remarks,type:'Board Task',assigned:'Unassigned',status:'Board Task',priority:'Medium',planned:date,target:date,category:'Planned'});
      save(customKey,customTasks);boardState[id]=b.dataset.ghSave;save(STORAGE,boardState);addingColumn=null;render();
    }));
    root.querySelectorAll('[data-gh-menu]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const m=b.parentElement;m.classList.toggle('open');root.querySelectorAll('.gh-menu').forEach(x=>{if(x!==m)x.classList.remove('open')});}));
    root.querySelectorAll('[data-gh-collapse]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.ghCollapse;collapsed[k]=!collapsed[k];render();}));
    root.querySelectorAll('[data-gh-clear]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.ghClear;Object.keys(boardState).forEach(id=>{if(boardState[id]===k)delete boardState[id]});save(STORAGE,boardState);render();}));
    root.querySelectorAll('[data-gh-refresh]').forEach(b=>b.addEventListener('click',render));
    root.querySelectorAll('[data-gh-current]').forEach(b=>b.addEventListener('click',render));

    root.querySelectorAll('[data-gh-edit]').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const id=b.dataset.ghEdit;
      const r=getData().find(x=>x._boardId===id);
      if(!r)return;
      if(r.custom){
        editingId=id;
        addingColumn=null;
        render();
        setTimeout(()=>root.querySelector('[data-gh-edit-title]')?.focus(),0);
      }else{
        if(r.moduleId && typeof openModuleEditor==='function'){
          openModuleEditor(r.moduleId,r.gid);
        }else if(r.meeting?.moduleId && typeof openModuleEditor==='function'){
          openModuleEditor(r.meeting.moduleId,r.gid);
        }else{
          alert('This task is linked to an existing PGA activity. Use the module details editor to edit it.');
        }
      }
    }));

    root.querySelectorAll('[data-gh-edit-cancel]').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();editingId=null;render();
    }));

    root.querySelectorAll('[data-gh-edit-save]').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const id=b.dataset.ghEditSave;
      const r=customTasks.find(x=>x._boardId===id);
      const form=b.closest('[data-gh-edit-form]');
      if(!r||!form)return;
      const title=form.querySelector('[data-gh-edit-title]').value.trim();
      if(!title){form.querySelector('[data-gh-edit-title]').focus();return;}
      const gid=form.querySelector('[data-gh-edit-pga]').value;
      const pg=(window.PGA_INDEX||[]).find(x=>x.gid===gid);
      const date=form.querySelector('[data-gh-edit-date]').value;
      const description=form.querySelector('[data-gh-edit-desc]').value.trim();
      const remarks=form.querySelector('[data-gh-edit-remark]').value.trim();
      Object.assign(r,{
        activity:title,
        pga:pg?.pga||'',
        gid:pg?.gid||'',
        description,desc:description,
        remarks,remark:remarks,
        planned:date,target:date
      });
      save(customKey,customTasks);
      editingId=null;
      render();
    }));

    root.querySelectorAll('[data-gh-delete]').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      const id=b.dataset.ghDelete;
      const r=getData().find(x=>x._boardId===id);
      if(!r)return;
      const name=r.activity||r.type||'this task';
      const ok=window.confirm(
        `Delete "${name}" from the PGA Task Board?\\n\\n`+
        (r.custom
          ? 'This board task will be permanently deleted.'
          : 'This will remove the task from the board only. The original PGA/module data will not be deleted.')
      );
      if(!ok)return;

      if(r.custom){
        customTasks=customTasks.filter(x=>x._boardId!==id);
        save(customKey,customTasks);
      }else{
        deletedTasks[id]=true;
        save('swift_pga_github_deleted_tasks_v1',deletedTasks);
      }
      delete boardState[id];
      save(STORAGE,boardState);
      render();
    }));

    root.querySelectorAll('[data-gh-card]').forEach(c=>{
      c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.ghCard);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
      c.addEventListener('dragend',()=>c.classList.remove('dragging'));
      c.addEventListener('click',e=>{
        if(e.target.closest('button')) return;
        const r=getData().find(x=>x._boardId===c.dataset.ghCard);
        if(!r)return;
        if(r.custom){
          editingId=r._boardId;addingColumn=null;render();
          setTimeout(()=>root.querySelector('[data-gh-edit-title]')?.focus(),0);
        }else if(r.moduleId&&typeof openModuleEditor==='function'){
          openModuleEditor(r.moduleId,r.gid);
        }
      });
    });
    root.querySelectorAll('[data-gh-drop]').forEach(zone=>{
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.closest('.gh-column').classList.add('drag-over');});
      zone.addEventListener('dragleave',()=>zone.closest('.gh-column').classList.remove('drag-over'));
      zone.addEventListener('drop',e=>{
        e.preventDefault();zone.closest('.gh-column').classList.remove('drag-over');
        const id=e.dataTransfer.getData('text/plain');if(!id)return;
        boardState[id]=zone.dataset.ghDrop;save(STORAGE,boardState);render();
      });
    });
  }
  window.__renderGithubTaskBoard=render;
  window.renderKanbanDashboard=render;
  document.addEventListener('DOMContentLoaded',()=>{
    const tab=document.getElementById('viewTabs')?.querySelector('[data-view="kanban"]');
    if(tab)tab.addEventListener('click',()=>setTimeout(()=>{if(window.state?.view==='kanban')render();},20));
    if(window.state?.view==='kanban')setTimeout(render,40);
  });
})();
</script>


<script id="github-board-default-init">
(function(){
  function showGithubBoard(){
    try{
      const tab=document.querySelector('#viewTabs .view-tab[data-view="kanban"]');
      const main=document.getElementById('main');
      const board=document.getElementById('kanbanView');
      const team=document.getElementById('teamStructureView');
      if(!tab || !board) return;
      document.querySelectorAll('#viewTabs .view-tab').forEach(t=>t.classList.toggle('active',t===tab));
      if(main) main.style.display='none';
      if(team) team.style.display='none';
      board.style.display='block';
      if(typeof window.__renderGithubTaskBoard==='function'){
        window.__renderGithubTaskBoard();
      }else if(typeof window.renderKanbanDashboard==='function'){
        window.renderKanbanDashboard();
      }
    }catch(e){ console.error('GitHub board initialisation failed:',e); }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>setTimeout(showGithubBoard,120));
  }else{
    setTimeout(showGithubBoard,120);
  }
})();
</script>


<script id="dynamic-task-board-date">
(function(){
  function formatDate(d){
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function getMonday(d){
    const x=new Date(d);
    const day=x.getDay();
    const diff=(day===0 ? -6 : 1-day);
    x.setDate(x.getDate()+diff);
    x.setHours(0,0,0,0);
    return x;
  }

  function updateTaskBoardDate(){
    const now=new Date();
    const monday=getMonday(now);
    const sunday=new Date(monday);
    sunday.setDate(monday.getDate()+6);

    const range=`${formatDate(monday)} to ${formatDate(sunday)}`;

    // Update common subtitle/header locations used by the task board.
    document.querySelectorAll('[data-task-board-date]').forEach(el=>{
      el.textContent=range;
    });

    // Update any task-board subtitle containing the old static date.
    document.querySelectorAll('p, .subtitle, .github-board-top p').forEach(el=>{
      if(el.textContent.includes('Task board for the current week') ||
         el.textContent.includes('current week')){
        el.textContent=`Task board for the current week · ${range} · Drag cards between columns.`;
      }
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',updateTaskBoardDate);
  }else{
    updateTaskBoardDate();
  }
  window.addEventListener('load',updateTaskBoardDate);
})();
</script>


<script id="auto-updated-date-script">
(function(){
  function updateHeaderDate(){
    const el = document.getElementById('autoUpdatedDate');
    if(!el) return;

    const now = new Date();
    const day = String(now.getDate()).padStart(2,'0');
    const month = now.toLocaleString('en-US',{month:'short'}).toUpperCase();
    const year = now.getFullYear();

    el.textContent = `${day} ${month} ${year}`;
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', updateHeaderDate);
  }else{
    updateHeaderDate();
  }
})();
</script>
