<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWIFT · PGA Integration Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF3F7;
    --bg-2:#F8FAFC;
    --surface:#FFFFFF;
    --surface-2:#E8F0F5;
    --border:#CFD9E2;
    --border-soft:#E2E9EF;
    --text:#172B3A;
    --text-dim:#5B6B78;
    --text-faint:#81909D;
    --accent:#087F8C;
    --accent-dim:#E3F4F5;
    --deployed:#159B68;
    --deployed-bg:#E7F6EF;
    --development:#C98216;
    --development-bg:#FFF4DF;
    --discussion:#3978C9;
    --discussion-bg:#EAF2FF;
    --notstarted:#D94B61;
    --notstarted-bg:#FDECEF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(8,127,140,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(57,120,201,0.055), transparent 55%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{background:var(--accent); color:#073B42;}
  .wrap{max-width:1220px; margin:0 auto; padding:0 24px 80px;}

  header.hero{padding:44px 24px 26px; border-bottom:1px solid var(--border-soft);}
  .hero-inner{max-width:1220px; margin:0 auto;}
  .eyebrow-row{display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); letter-spacing:0.03em; margin-bottom:16px; flex-wrap:wrap;}
  .eyebrow-row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .save-indicator{
    margin-left:auto; font-size:11.5px; color:var(--text-faint);
    display:flex; align-items:center; gap:6px;
  }
  .save-indicator .pip{width:6px;height:6px;border-radius:50%;background:var(--deployed); opacity:0; transition:opacity .3s;}
  .save-indicator.saving .pip{opacity:1; background:var(--development);}
  .save-indicator.saved .pip{opacity:1; background:var(--deployed);}

  h1{font-family:'Libre Franklin', sans-serif; font-weight:800; font-size:clamp(28px,4vw,40px); margin:0 0 8px; letter-spacing:-0.02em; color:#172B3A;}
  .subtitle{color:var(--text-dim); font-size:15px; max-width:680px; margin:0 0 28px;}

  .stats-row{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border-soft); border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden;}
  .stat{background:var(--bg-2); padding:16px 18px; cursor:pointer; transition:background .15s; position:relative;}
  .stat:hover{background:var(--surface);}
  .stat.active{background:var(--surface-2);}
  .stat.active::after{content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--stat-color, var(--accent));}
  .stat .num{font-family:'Libre Franklin', sans-serif; font-weight:800; font-size:28px; color:#172B3A; line-height:1; margin-bottom:6px;}
  .stat .lbl{font-size:12px; color:var(--text-dim); font-weight:500;}
  .stat .lbl .swatch{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:6px; vertical-align:1px; background:var(--stat-color, var(--text-faint));}

  .progress-track{margin-top:20px; height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex; border:1px solid var(--border-soft);}
  .progress-seg{height:100%;}

  /* View tabs */
  .view-tabs{display:flex; gap:6px; margin-top:24px;}
  .view-tab{
    font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    color:var(--text-dim); background:var(--bg-2); border:1px solid var(--border-soft);
    padding:9px 16px; border-radius:8px; cursor:pointer; transition:all .15s;
  }
  .view-tab:hover{color:var(--text); border-color:var(--border);}
  .view-tab.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}

  /* Controls */
  .controls{position:sticky; top:0; z-index:20; background:rgba(248,250,252,0.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-soft); padding:14px 24px;}
  .controls-inner{max-width:1220px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-box{flex:1 1 240px; position:relative;}
  .search-box input{width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 14px 10px 36px; border-radius:8px; font-family:'Inter',sans-serif; font-size:14px; outline:none; transition:border-color .15s;}
  .search-box input:focus{border-color:var(--accent);}
  .search-box input::placeholder{color:var(--text-faint);}
  .search-box svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--text-faint);}
  select.filter-select{background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; outline:none; cursor:pointer; max-width:220px;}
  .clear-btn{background:transparent; border:1px solid var(--border); color:var(--text-dim); padding:10px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s;}
  .clear-btn:hover{border-color:var(--text-faint); color:var(--text);}

  .multi-filter{position:relative;display:inline-flex;min-width:190px;}
  .multi-filter-btn{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 34px 10px 14px;border-radius:8px;font:13.5px 'Inter',sans-serif;cursor:pointer;text-align:left;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .multi-filter-btn:after{content:"⌄";position:absolute;right:12px;top:50%;transform:translateY(-54%);color:var(--text-faint);font-size:16px;}
  .multi-filter-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:80;background:#14212B;border:1px solid var(--border);border-radius:9px;box-shadow:0 14px 34px rgba(0,0,0,.4);padding:7px;max-height:290px;overflow:auto;}
  .multi-filter-search-wrap{position:sticky;top:0;z-index:2;background:#14212B;padding:0 0 7px;margin-bottom:4px;border-bottom:1px solid var(--border);}
  .multi-filter-search{width:100%;background:#0D171F;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 9px;font:12px 'Inter',sans-serif;outline:none;}
  .multi-filter-search:focus{border-color:var(--accent);}
  .multi-filter-search::placeholder{color:var(--text-faint);}
  .multi-filter.open .multi-filter-menu{display:block;}
  .multi-filter-option{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:6px;font-size:12.5px;color:var(--text);cursor:pointer;}
  .multi-filter-option:hover{background:var(--surface-2);}
  .multi-filter-option input{accent-color:var(--accent);}
  .multi-filter-all{border-bottom:1px solid var(--border);margin-bottom:5px;padding-bottom:7px;}
  .filter-select.native-multi-source{display:none!important;}
  .result-count{font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); white-space:nowrap; margin-left:auto;}

  main{padding-top:26px;}
  .section-label{font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--text-faint); margin:32px 0 12px; display:flex; align-items:center; gap:10px;}
  .section-label::after{content:""; flex:1; height:1px; background:var(--border-soft);}

  .module-intro{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:16px; font-size:13.5px; color:var(--text-dim); line-height:1.6;
  }
  .module-intro b{color:var(--text);}

  .pga-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); margin-bottom:9px; overflow:hidden;}
  .pga-head{display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer; user-select:none;}
  .pga-head:hover{background:var(--surface-2);}
  .pga-sno{font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--text-faint); min-width:24px;}
  .pga-name{font-weight:600; font-size:14.5px; color:var(--text); flex:1; min-width:160px;}
  .pga-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; font-family:'JetBrains Mono', monospace; letter-spacing:0.01em; white-space:nowrap;}
  .badge-deployed{background:var(--deployed-bg); color:var(--deployed);}
  .badge-development{background:var(--development-bg); color:var(--development);}
  .badge-discussion{background:var(--discussion-bg); color:var(--discussion);}
  .badge-notstarted{background:var(--notstarted-bg); color:var(--notstarted);}
  .owner-tag{font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono', monospace;}
  .chevron{width:14px; height:14px; stroke:var(--text-faint); transition:transform .2s ease; flex-shrink:0;}
  .pga-card.open .chevron{transform:rotate(90deg);}
  .item-count-pill{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--text-faint); background:var(--bg-2); border:1px solid var(--border-soft); padding:2px 8px; border-radius:20px;}
  .meeting-chip{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:var(--accent);
    background:var(--accent-dim); border:1px solid transparent; padding:3px 9px 3px 7px; border-radius:20px;
    cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap;
  }
  .meeting-chip:hover{border-color:var(--accent);}
  .meeting-chip svg{width:11px; height:11px;}
  .meeting-chip.empty{color:var(--text-faint); background:var(--bg-2); border-color:var(--border-soft);}

  .team-chip{font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:#5B55A5; background:#F0EFFB; border:1px solid transparent; padding:3px 9px 3px 7px; border-radius:20px; cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap;}
  .team-chip:hover{border-color:#7771BD;}
  .team-chip svg{width:11px; height:11px;}
  .team-chip.empty{color:var(--text-faint); background:var(--bg-2); border-color:var(--border-soft);}
  .team-panel{padding:12px 18px; background:var(--bg-2); border-bottom:1px solid var(--border-soft); display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .team-panel label{font-size:11px; color:var(--text-faint); display:block; margin-bottom:4px; font-family:'JetBrains Mono',monospace;}
  .team-panel input{background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-family:'Inter',sans-serif; font-size:13px; outline:none; min-width:160px;}
  .team-panel input:focus{border-color:var(--accent);}

  .modules-total{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim); margin-top:14px; display:flex; gap:8px; align-items:center;}
  .modules-total b{color:#172B3A; font-family:'Libre Franklin',sans-serif; font-size:15px;}

  /* Item / Module completion summary */
  .item-completion-summary{
    margin-top:18px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .completion-summary-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px 18px 14px;
    border-bottom:1px solid var(--border-soft);
    flex-wrap:wrap;
  }
  .completion-summary-title{
    font-family:'Libre Franklin',sans-serif;
    font-weight:800;
    font-size:16px;
    color:#172B3A;
  }
  .completion-summary-sub{
    font-size:12px;
    color:var(--text-faint);
    margin-top:2px;
  }
  .completion-summary-message{
    font-family:'Libre Franklin',sans-serif;
    font-weight:800;
    font-size:18px;
    color:var(--accent);
    white-space:nowrap;
  }
  .completion-kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--border-soft);
    border-bottom:1px solid var(--border-soft);
  }
  .completion-kpi{
    background:var(--bg-2);
    padding:13px 16px;
  }
  .completion-kpi .kpi-num{
    font-family:'Libre Franklin',sans-serif;
    font-weight:800;
    font-size:23px;
    line-height:1;
    margin-bottom:5px;
  }
  .completion-kpi .kpi-label{
    font-size:11px;
    color:var(--text-dim);
  }
  .completion-kpi.total .kpi-num{color:#172B3A;}
  .completion-kpi.completed .kpi-num{color:var(--deployed);}
  .completion-kpi.pending .kpi-num{color:var(--development);}
  .completion-kpi.percent .kpi-num{color:var(--accent);}
  .completion-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:14px;
  }
  .completion-list{
    min-width:0;
    background:var(--bg-2);
    border:1px solid var(--border-soft);
    border-radius:8px;
    overflow:hidden;
  }
  .completion-list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--border-soft);
    font-size:12px;
    font-weight:700;
  }
  .completion-list-head .count{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    background:var(--surface);
    border:1px solid var(--border-soft);
    padding:2px 7px;
    border-radius:20px;
  }
  .completion-list.completed .completion-list-head{color:var(--deployed);}
  .completion-list.pending .completion-list-head{color:var(--development);}
  .completion-items{
    max-height:240px;
    overflow:auto;
    padding:6px 10px;
  }
  .completion-item{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:8px;
    padding:7px 2px;
    border-bottom:1px solid rgba(43,55,70,.55);
    font-size:11.5px;
  }
  .completion-item:last-child{border-bottom:none;}
  .completion-item .icon{font-size:12px; line-height:1.4;}
  .completion-item .name{color:var(--text); font-weight:600; line-height:1.35;}
  .completion-item .agency{color:var(--text-faint); font-size:10.5px; margin-top:2px; line-height:1.35;}
  .completion-empty{padding:16px 10px; color:var(--text-faint); font-size:11.5px; font-style:italic;}
  .completion-note{
    padding:0 14px 13px;
    color:var(--text-faint);
    font-size:10.5px;
  }

  .completion-bifurcation{
    border-top:1px solid var(--border-soft);
    padding:13px 14px 15px;
    background:var(--bg-2);
  }
  .bifurcation-title{
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:10.5px;
    color:var(--text-faint);
    margin-bottom:9px;
  }
  .bifurcation-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .bifurcation-card{
    display:flex;
    align-items:center;
    gap:9px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:9px 11px;
  }
  .bifurcation-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    flex-shrink:0;
    background:var(--accent);
  }
  .bifurcation-card.deployed .bifurcation-dot{background:var(--deployed);}
  .bifurcation-card.pending .bifurcation-dot{background:var(--development);}
  .bifurcation-card.total .bifurcation-dot{background:var(--accent);}
  .bifurcation-card strong{
    display:block;
    font-family:'Libre Franklin',sans-serif;
    font-size:16px;
    line-height:1.1;
    color:var(--text);
  }
  .bifurcation-card span:not(.bifurcation-dot){
    display:block;
    font-size:10.5px;
    color:var(--text-faint);
    margin-top:2px;
  }
  @media (max-width:760px){
    .bifurcation-grid{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .completion-kpis{grid-template-columns:repeat(2,1fr);}
    .completion-detail{grid-template-columns:1fr;}
    .completion-summary-message{font-size:16px;}
  }

  .pga-body{display:none; border-top:1px solid var(--border-soft);}
  .pga-card.open .pga-body{display:block;}

  .meeting-panel{
    padding:12px 18px; background:var(--bg-2); border-bottom:1px solid var(--border-soft);
    display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;
  }
  .meeting-panel label{font-size:11px; color:var(--text-faint); display:block; margin-bottom:4px; font-family:'JetBrains Mono',monospace;}
  .meeting-panel input, .meeting-panel textarea{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:7px 10px; border-radius:6px; font-family:'Inter',sans-serif; font-size:13px; outline:none;
  }
  .meeting-panel input:focus, .meeting-panel textarea:focus{border-color:var(--accent);}
  .meeting-panel .mp-date{width:175px;}
  .meeting-panel .mp-notes{flex:1; min-width:200px; resize:vertical; min-height:36px;}
  .mp-actions{display:flex; gap:6px;}
  .btn-save, .btn-cancel{
    padding:7px 14px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; border:1px solid transparent;
  }
  .btn-save{background:var(--accent); color:#073B42;}
  .btn-save:hover{opacity:0.9;}
  .btn-cancel{background:transparent; border-color:var(--border); color:var(--text-dim);}
  .btn-cancel:hover{color:var(--text);}

  .item-row{padding:13px 18px 13px 56px; border-bottom:1px solid var(--border-soft); display:flex; gap:14px; align-items:flex-start; position:relative;}
  .item-row:last-child{border-bottom:none;}
  .item-main{flex:1; min-width:0;}
  .item-type{font-weight:600; font-size:13.5px; color:var(--text); margin-bottom:3px; display:flex; align-items:center; gap:8px;}
  .item-desc{font-size:13px; color:var(--text-dim); line-height:1.55; margin-bottom:6px;}
  .item-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .tag{font-size:10.5px; color:var(--text-faint); background:var(--bg-2); border:1px solid var(--border-soft); padding:2px 7px; border-radius:5px; font-family:'JetBrains Mono', monospace;}
  .item-remarks{font-size:12.5px; color:var(--text-faint); border-left:2px solid var(--border); padding-left:10px; margin-top:8px; white-space:pre-line;}
  .item-status-col{flex-shrink:0; text-align:right; max-width:200px; display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .edit-btn{
    background:none; border:1px solid var(--border-soft); color:var(--text-faint);
    width:24px; height:24px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:all .15s;
  }
  .edit-btn:hover{color:var(--accent); border-color:var(--accent);}
  .edit-btn svg{width:12px; height:12px;}

  .edit-panel{
    grid-column:1/-1; width:100%; margin-top:10px; padding:12px; background:var(--bg-2);
    border:1px solid var(--border-soft); border-radius:8px; display:flex; flex-direction:column; gap:8px;
  }
  .edit-panel .ep-row{display:flex; gap:8px; flex-wrap:wrap;}
  .edit-panel label{font-size:10.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; display:block; margin-bottom:3px;}
  .edit-panel input, .edit-panel textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:7px 10px; border-radius:6px; font-family:'Inter',sans-serif; font-size:12.5px; outline:none;
  }
  .edit-panel input:focus, .edit-panel textarea:focus{border-color:var(--accent);}
  .ep-field{flex:1; min-width:140px;}

  .mp-row{display:flex; gap:10px; flex-wrap:wrap;}
  .mp-row > div{display:flex; flex-direction:column;}
  select.mp-status{background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-family:'Inter',sans-serif; font-size:13px; outline:none; cursor:pointer;}
  .mp-points-wrap{display:flex; flex-direction:column; gap:6px;}
  .mp-points-wrap > label{font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;}
  .mp-point{display:flex; align-items:baseline; gap:10px; background:var(--surface); border:1px solid var(--border-soft); border-radius:6px; padding:7px 10px; font-size:12.5px;}
  .mp-point.read-only{background:transparent; border:none; border-left:2px solid var(--border); border-radius:0; padding:5px 0 5px 10px; margin-bottom:2px;}
  .mp-point-date{font-family:'JetBrains Mono',monospace; color:var(--text-faint); font-size:11px; white-space:nowrap; flex-shrink:0;}
  .mp-point-text{color:var(--text-dim); flex:1;}
  .mp-point-remove{background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:15px; line-height:1; padding:0 2px; flex-shrink:0;}
  .mp-point-remove:hover{color:var(--notstarted);}
  .mp-add-point{display:flex; gap:8px;}
  .mp-add-point input{flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-family:'Inter',sans-serif; font-size:12.5px; outline:none;}
  .mp-add-point input:focus{border-color:var(--accent);}
  .mp-empty{color:var(--text-faint); font-size:12px; font-style:italic;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--text-faint); font-size:14px;}
  mark{background:rgba(34,195,214,0.28); color:#172B3A; border-radius:2px; padding:0 1px;}



  /* Refined colour treatment */
  .hero-inner{position:relative;}
  .stats-row{box-shadow:0 2px 8px rgba(23,43,58,.05);}
  .stat:hover{background:#F7FAFC;}
  .stat.active{background:#EDF7F8;}
  .pga-table{box-shadow:0 3px 12px rgba(23,43,58,.05);}
  .pga-table thead th{background:#172B3A;color:#B9C9D5;border-bottom-color:#263D4D;}
  .pga-table tbody tr:hover{background:#F4F8FA;}
  .pga-item-summary{box-shadow:0 2px 8px rgba(23,43,58,.04);}
  .completion-summary{box-shadow:0 2px 8px rgba(23,43,58,.04);}
  .completion-list,.pga-completion-list{background:#FBFCFD;}
  .pga-summary-message,.completion-summary-message{letter-spacing:-.01em;}

  /* Per-PGA Item / Module completion summary */
  .pga-item-summary{margin:4px 18px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .pga-summary-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
  .pga-summary-title{font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:14px;color:var(--text);}
  .pga-summary-sub{color:var(--text-faint);font-size:10.5px;margin-top:2px;}
  .pga-summary-message{font-family:'Libre Franklin',sans-serif;font-weight:800;color:var(--accent);font-size:15px;}
  .pga-summary-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-soft);}
  .pga-summary-kpi{background:var(--bg-2);padding:9px 12px;}
  .pga-summary-kpi strong{display:block;font-family:'Libre Franklin',sans-serif;font-size:19px;line-height:1;color:var(--text);}
  .pga-summary-kpi span{display:block;color:var(--text-faint);font-size:9.5px;margin-top:3px;}
  .pga-summary-kpi.done strong{color:var(--deployed);}
  .pga-summary-kpi.pending strong{color:var(--development);}
  .pga-summary-kpi.progress strong{color:var(--accent);}
  .pga-completion-track{height:5px;background:var(--surface-2);margin:10px 12px 2px;border-radius:4px;overflow:hidden;}
  .pga-completion-track div{height:100%;background:var(--deployed);border-radius:4px;}
  .pga-completion-lists{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 12px 12px;}
  .pga-completion-list{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:7px;overflow:hidden;}
  .pga-completion-list-head{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;font-size:10.5px;font-weight:700;border-bottom:1px solid var(--border-soft);}
  .pga-completion-list-head b{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);}
  .pga-completion-list.done .pga-completion-list-head{color:var(--deployed);}
  .pga-completion-list.pending .pga-completion-list-head{color:var(--development);}
  .pga-completion-list-body{max-height:150px;overflow:auto;padding:3px 8px;}
  .pga-completion-item{display:grid;grid-template-columns:auto 1fr;gap:7px;padding:6px 2px;border-bottom:1px solid var(--border-soft);}
  .pga-completion-item:last-child{border-bottom:none;}
  .pga-completion-icon{font-size:11px;line-height:1.4;}
  .pga-completion-name{color:var(--text);font-size:10.5px;font-weight:600;line-height:1.3;}
  .pga-completion-status{color:var(--text-faint);font-size:9.5px;line-height:1.3;margin-top:1px;}
  .pga-completion-empty{color:var(--text-faint);font-size:10px;font-style:italic;padding:9px 2px;}
  @media (max-width:760px){
    .pga-summary-kpis{grid-template-columns:repeat(2,1fr);}
    .pga-completion-lists{grid-template-columns:1fr;}
    .pga-summary-message{font-size:13px;}
    .pga-item-summary{margin-left:10px;margin-right:10px;}
  }

  /* PGA listing table */
  .pga-table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden;}
  .pga-table thead th{
    text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.04em;
    color:var(--text-faint); text-transform:uppercase; padding:12px 16px; border-bottom:1px solid var(--border-soft); background:var(--bg-2);
  }
  .pga-table tbody tr{border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .15s;}
  .pga-table tbody tr:hover{background:var(--surface-2);}
  .pga-table tbody tr:last-child{border-bottom:none;}
  .pga-table td{padding:12px 16px; font-size:13.5px; vertical-align:middle;}
  .pga-table .td-name{font-weight:600; color:var(--text);}
  .pga-table .td-sno{font-family:'JetBrains Mono',monospace; color:var(--text-faint); font-size:12px;}
  .mini-bar{display:flex; height:6px; width:110px; border-radius:4px; overflow:hidden; background:var(--bg-2); border:1px solid var(--border-soft);}
  .mini-seg{height:100%;}
  .row-detail{display:none; background:var(--bg-2);}
  .row-detail.open{display:table-row;}
  .row-detail td{padding:0;}

  @media (max-width:760px){
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .stat:nth-child(5){grid-column:span 2;}
    .item-row{padding-left:18px; flex-direction:column;}
    .item-status-col{text-align:left; max-width:none; align-items:flex-start;}
    .pga-meta{justify-content:flex-start;}
    .pga-table{display:block; overflow-x:auto;}
    .view-tabs{flex-wrap:wrap;}
  }

  /* ===== Professional dark dashboard ===== */
  :root{
    --bg:#0B1117; --bg-2:#111A23; --surface:#16222D; --surface-2:#1C2B38;
    --border:#2A3A48; --border-soft:#22313D; --text:#E8F0F5; --text-dim:#A9B8C4;
    --text-faint:#718594; --accent:#35B9C7; --accent-dim:#123A42;
    --deployed:#2BC48A; --deployed-bg:#12382D; --development:#F0A83A; --development-bg:#3A2A13;
    --discussion:#5B9BE7; --discussion-bg:#142C49; --notstarted:#E85B70; --notstarted-bg:#3B1820;
  }
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(53,185,199,.09), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(91,155,231,.07), transparent 55%);
    color:var(--text);
  }
  h1,.stat .num,.completion-summary-title,.pga-summary-title,.completion-kpi .kpi-num,
  .pga-name,.item-type,.kanban-card-name,.kanban-header h2{color:var(--text)!important;}
  .subtitle,.stat .lbl,.text-dim,.pga-summary-sub,.completion-summary-sub{color:var(--text-dim);}
  header.hero{border-bottom-color:var(--border);}
  .stats-row,.pga-table,.pga-card,.module-intro,.item-completion-summary,.pga-item-summary,
  .completion-summary,.completion-list,.pga-completion-list{box-shadow:0 3px 14px rgba(0,0,0,.18);}
  .stat,.pga-table thead th,.completion-kpi,.pga-completion-list,.completion-list{background:var(--surface);}
  .stat:hover,.pga-table tbody tr:hover,.pga-head:hover{background:var(--surface-2);}
  .stat.active{background:#18303A;}
  .controls{background:rgba(11,17,23,.94);border-bottom-color:var(--border);}
  .search-box input,select.filter-select,.edit-panel input,.edit-panel textarea,
  .meeting-panel input,.meeting-panel textarea,select.mp-status{background:#101A23;color:var(--text);border-color:var(--border);}
  .search-box input::placeholder{color:#627482;}
  .clear-btn,.export-btn{background:#111C25;color:var(--text-dim);border-color:var(--border);}
  .clear-btn:hover,.export-btn:hover{background:var(--surface-2);color:var(--text);}
  .pga-table{background:var(--surface);border-color:var(--border);}
  .pga-table thead th{background:#0F1922;color:#9EB1BE;border-bottom-color:var(--border);}
  .pga-table tbody tr{border-bottom-color:var(--border);}
  .pga-table td{color:var(--text-dim);}
  .pga-table .td-name{color:var(--text);}
  .pga-card,.module-intro,.item-completion-summary,.pga-item-summary{background:var(--surface);border-color:var(--border);}
  .pga-body,.meeting-panel,.team-panel,.edit-panel{background:#101A23;border-color:var(--border);}
  .item-row{border-bottom-color:var(--border);}
  .item-desc,.item-remarks,.owner-tag,.item-count-pill{color:var(--text-dim);}
  .tag,.item-count-pill{background:#101A23;border-color:var(--border);color:var(--text-faint);}
  .view-tab{background:#111C25;border-color:var(--border);color:var(--text-dim);}
  .view-tab.active{background:#123A42;border-color:var(--accent);color:var(--accent);}
  .progress-track,.mini-bar,.pga-completion-track{background:#20303C;border-color:var(--border);}
  mark{background:#31565C;color:#F4FBFC;}

  /* Excel menu */
  .export-wrap{position:relative;display:inline-flex;}
  .export-btn{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;font-weight:700;}
  .export-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);min-width:205px;background:#14212B;border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.35);padding:6px;z-index:50;}
  .export-menu.open{display:block;}
  .export-menu button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:0;padding:9px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;}
  .export-menu button:hover{background:var(--surface-2);}

  /* Module detail panel */
  .module-modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;display:none;padding:28px;overflow:auto;}
  .module-modal.open{display:flex;align-items:flex-start;justify-content:center;}
  .module-dialog{width:min(920px,100%);background:#121D26;border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.45);margin:20px auto;}
  .module-dialog-head{display:flex;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#121D26;z-index:2;}
  .module-dialog-title{font-family:'Libre Franklin',sans-serif;font-size:18px;font-weight:800;color:var(--text);}
  .module-dialog-sub{font-size:11px;color:var(--text-faint);margin-top:4px;}
  .module-close{width:32px;height:32px;border:1px solid var(--border);background:#0E171F;color:var(--text-dim);border-radius:7px;cursor:pointer;font-size:20px;}
  .module-dialog-body{padding:18px 20px;}
  .module-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .module-detail-field{display:flex;flex-direction:column;gap:5px;}
  .module-detail-field.full{grid-column:1/-1;}
  .module-detail-field label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
  .module-detail-field input,.module-detail-field textarea,.module-detail-field select{
    width:100%;background:#0D171F;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:9px 10px;font:13px 'Inter',sans-serif;outline:none;
  }
  .module-detail-field textarea{min-height:78px;resize:vertical;}
  .module-detail-field input:focus,.module-detail-field textarea:focus,.module-detail-field select:focus{border-color:var(--accent);}
  .module-static{background:#0D171F;border:1px solid var(--border);border-radius:7px;padding:10px;font-size:12px;color:var(--text-dim);line-height:1.55;white-space:pre-line;}
  .module-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .module-save{background:var(--accent);color:#06252A;border:0;border-radius:7px;padding:9px 16px;font-weight:800;cursor:pointer;}
  .module-cancel{background:#101A23;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;padding:9px 16px;cursor:pointer;}
  .module-info-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .module-info-chip{font-size:10.5px;color:var(--text-dim);background:#0D171F;border:1px solid var(--border);border-radius:20px;padding:4px 8px;}

  /* Kanban */
  .kanban-wrap{padding-top:26px;}
  .kanban-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
  .kanban-header h2{margin:0;font-size:20px;}
  .kanban-header p{margin:4px 0 0;color:var(--text-faint);font-size:12px;}
  .kanban-board{display:grid;grid-template-columns:repeat(4,minmax(235px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;}
  .kanban-column{background:#0F1922;border:1px solid var(--border);border-radius:11px;min-height:330px;}
  .kanban-column-head{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#14212B;border-bottom:1px solid var(--border);border-radius:11px 11px 0 0;}
  .kanban-column-title{font-size:12px;font-weight:800;color:var(--text);}
  .kanban-column-count{font:10px 'JetBrains Mono',monospace;color:var(--text-faint);background:#0D171F;border:1px solid var(--border);padding:3px 7px;border-radius:20px;}
  .kanban-column-body{padding:9px;display:flex;flex-direction:column;gap:9px;}
  .kanban-card{background:#16242F;border:1px solid #2A3B49;border-radius:8px;padding:11px;cursor:pointer;transition:.15s;}
  .kanban-card:hover{transform:translateY(-1px);border-color:#3B5667;box-shadow:0 7px 18px rgba(0,0,0,.22);}
  .kanban-card-name{font-size:12.5px;font-weight:800;line-height:1.35;}
  .kanban-card-sno{font:9.5px 'JetBrains Mono',monospace;color:var(--text-faint);margin-top:6px;}
  .kanban-card-stats{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--text-faint);}
  .kanban-card-stats strong{color:var(--deployed);}
  .kanban-progress{height:5px;background:#263744;border-radius:5px;overflow:hidden;margin-top:7px;}
  .kanban-progress span{display:block;height:100%;background:var(--deployed);}
  .kanban-empty{text-align:center;padding:30px 8px;color:var(--text-faint);font-size:11px;font-style:italic;}
  @media(max-width:900px){.module-detail-grid{grid-template-columns:1fr}.kanban-board{grid-template-columns:repeat(4,235px)}}
  @media(max-width:760px){.module-modal{padding:10px}.module-dialog{margin:0}.export-menu{right:auto;left:0}}


  /* Module management */
  .pga-add-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#0F1922;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .pga-add-info{font-size:11px;color:var(--text-faint);}
  .add-module-btn{background:#163C43;color:#55D3DE;border:1px solid #2B6870;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;}
  .add-module-btn:hover{background:#1B4B53;}
  .module-modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:24px;background:rgba(0,0,0,.72);z-index:200;overflow:auto;}
  .module-modal.open{display:flex;}
  .module-dialog{width:min(960px,100%);margin:10px auto;background:#111C25;border:1px solid var(--border);border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.5);}
  .module-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;padding:18px 20px;border-bottom:1px solid var(--border);}
  .module-dialog-title{font:800 18px 'Libre Franklin',sans-serif;color:var(--text);}
  .module-dialog-sub{font-size:11px;color:var(--text-faint);margin-top:4px;}
  .module-close{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:#0B141C;color:var(--text-dim);font-size:20px;cursor:pointer;}
  .module-dialog-body{padding:18px 20px;}
  .module-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .module-field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .module-field.full{grid-column:1/-1;}
  .module-field label{font:10px 'JetBrains Mono',monospace;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
  .module-field input,.module-field textarea,.module-field select{width:100%;background:#0B151D;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:9px 10px;font:13px 'Inter',sans-serif;outline:none;}
  .module-field textarea{min-height:74px;resize:vertical;}
  .module-field input:focus,.module-field textarea:focus,.module-field select:focus{border-color:var(--accent);}
  .module-status-custom{display:none;}
  .module-status-custom.show{display:flex;}
  .module-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .module-actions-right{display:flex;gap:8px;}
  .module-save{background:var(--accent);color:#06262B;border:0;border-radius:7px;padding:9px 17px;font-weight:800;cursor:pointer;}
  .module-cancel,.module-delete{background:#0D171F;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;padding:9px 15px;cursor:pointer;}
  .module-delete{color:#F07A88;border-color:#64313A;}
  .module-delete:hover{background:#321921;}
  .module-static{background:#0B151D;border:1px solid var(--border);border-radius:7px;padding:10px;color:var(--text-dim);font-size:12px;line-height:1.5;white-space:pre-line;}
  .module-date-note{font-size:9.5px;color:var(--text-faint);margin-top:2px;}
  .kanban-pga-expanded{margin-top:10px;border-top:1px solid var(--border);padding-top:9px;display:flex;flex-direction:column;gap:6px;}
  .kanban-module-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0D171F;border:1px solid var(--border);border-radius:6px;padding:7px 8px;cursor:pointer;}
  .kanban-module-row:hover{background:#162631;}
  .kanban-module-name{font-size:10.5px;font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kanban-module-status{font-size:9.5px;color:var(--text-faint);white-space:nowrap;}
  @media(max-width:700px){.module-form-grid{grid-template-columns:1fr}.module-field.full{grid-column:auto}.module-modal{padding:10px}.module-dialog{margin:0}.module-actions{flex-direction:column}.module-actions-right{justify-content:flex-end;}}


/* Final module status presentation */
.status-select{background:#0D171F!important;color:#F1F6F9!important;border:1px solid #344957!important;}
.status-select option{background:#111C25!important;color:#F1F6F9!important;}
.custom-status-field{display:none;flex-direction:column;gap:5px;}
.custom-status-field.show{display:flex;}
.custom-status-field label{font:10px 'JetBrains Mono',monospace;color:#9FB2BF;text-transform:uppercase;}
.custom-status-field input{background:#0D171F!important;color:#F1F6F9!important;border:1px solid #344957!important;border-radius:7px;padding:9px 10px;font:13px 'Inter',sans-serif;}
.status-in-discussion{background:#163A59!important;color:#78C0FF!important;}
.status-development-not-started{background:#42232A!important;color:#FF899A!important;}
.status-in-development{background:#473315!important;color:#FFC45D!important;}
.status-infosys-testing{background:#173C50!important;color:#70D0F5!important;}
.status-integration-testing{background:#26365A!important;color:#A8BDFF!important;}
.status-dccs-vapt{background:#3B2750!important;color:#D3A0FF!important;}
.status-ma-vapt{background:#49263E!important;color:#FF9ED0!important;}
.status-deployed-in-production{background:#123B30!important;color:#58E5AB!important;}
.status-other{background:#293640!important;color:#D8E2E8!important;}


/* Readable text selection/highlight */
::selection{
  background:#2A5964 !important;
  color:#FFFFFF !important;
}
::-moz-selection{
  background:#2A5964 !important;
  color:#FFFFFF !important;
}
/* Keep the form labels themselves bright and readable */
#moduleModal .module-detail-field label{
  color:#BFD0DA !important;
  -webkit-text-fill-color:#BFD0DA !important;
}


/* ===== Final text colour correction ===== */
/* Make modal headings/labels clearly readable even before selection */
#moduleModal .module-detail-field label,
#moduleModal label,
#moduleModal .module-dialog-title,
#moduleModal .module-dialog-sub,
#moduleModal .module-static,
#moduleModal .module-info-chip {
  color:#F4F8FB !important;
  -webkit-text-fill-color:#F4F8FB !important;
  opacity:1 !important;
}

/* Make the highlighted/selected text use white text, not cyan text */
#moduleModal ::selection,
#moduleModal *::selection {
  background:#2B4655 !important;
  color:#FFFFFF !important;
  -webkit-text-fill-color:#FFFFFF !important;
}

/* Firefox */
#moduleModal ::-moz-selection,
#moduleModal *::-moz-selection {
  background:#2B4655 !important;
  color:#FFFFFF !important;
}

/* Explicitly brighten the specific label shown in the screenshot */
#moduleModal .module-detail-field label {
  text-shadow:0 0 1px rgba(255,255,255,.15);
  letter-spacing:.05em;
}


/* ===== RoD / document auto-update ===== */
.rod-upload-box{

<script>
(function () {
  const BUCKET_META = {
    deployed:    { label: 'Deployed',       cls: 'badge-deployed',    color: 'var(--deployed)' },
    development: { label: 'In Development', cls: 'badge-development', color: 'var(--development)' },
    discussion:  { label: 'Discussion',      cls: 'badge-discussion',  color: 'var(--discussion)' },
    notstarted:  { label: 'Not Started',    cls: 'badge-notstarted',  color: 'var(--notstarted)' }
  };
  const BUCKET_ORDER = ['deployed', 'development', 'discussion', 'notstarted'];
  const SECTION_TITLES = { deployed: 'Deployed', development: 'In Development', discussion: 'Initial Discussion', notstarted: 'Not Started' };

  function esc(str) {
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function highlight(text, term) {
    const safe = esc(text);
    if (!term) return safe;
    try {
      const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return safe.replace(re, '<mark>$1</mark>');
    } catch (e) { return safe; }
  }
  function slugify(s) {
    return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  }
  function classify(statusText, fallback) {
    const s = (statusText || '').toLowerCase();
    if (!s) return fallback;
    if (s.includes('not started')) return 'notstarted';
    if (s.includes('deployed') && !s.includes('to be deployed')) return 'deployed';
    if (s.includes('discussion')) return 'discussion';
    return 'development';
  }
  function moduleMatch(it, filter) {
    if (!filter) return true;
    const t = (it.type || '').toLowerCase();
    if (filter === 'sso') return t.includes('single sign') || t.includes('sso');
    if (filter === 'lic') return t.includes('licence') || t.includes('license') || t.includes('consumption');
    return true;
  }
  function selectedValues(v){
    if(Array.isArray(v)) return v.filter(Boolean);
    return v ? [v] : [];
  }
  function filterHas(v, value){
    const a=selectedValues(v);
    return a.length===0 || a.includes(value);
  }
  function modTypeMatch(it, filter) {
    if (!filterHas(filter, (it.modtype || '').trim())) return false;
    return true;
  }

  function todayStr() {
    return new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // ---------------------------------------------------------------
  // Data: edits & meetings (persisted via window.storage, shared=true
  // so the whole team sees the same live tracker)
  // ---------------------------------------------------------------
  var EDITS = {};
  var ADDED_MODULES = {};
  var DELETED_MODULES = {};
  let MEETINGS = {};  // pgaSlug -> {date, notes}
  let TEAM = {};       // pgaSlug -> {resource, inspector, superintendent}

  async function loadOverrides() {
    try {
      const r = await window.storage.get('edits', true);
      if (r && r.value) EDITS = JSON.parse(r.value);
    } catch (e) { EDITS = {}; }
    try {
      const r = await window.storage.get('meetings', true);
      if (r && r.value) MEETINGS = JSON.parse(r.value);
    } catch (e) { MEETINGS = {}; }
    try {
      const r = await window.storage.get('team', true);
      if (r && r.value) TEAM = JSON.parse(r.value);
    } catch (e) { TEAM = {}; }
    try { const r = await window.storage.get('addedModules', true); ADDED_MODULES = r && r.value ? JSON.parse(r.value) : {}; } catch(e){ ADDED_MODULES = {}; }
    try { const r = await window.storage.get('deletedModules', true); DELETED_MODULES = r && r.value ? JSON.parse(r.value) : {}; } catch(e){ DELETED_MODULES = {}; }
  }

  function setSaveIndicator(mode) {
    const el = document.getElementById('saveIndicator');
    const txt = document.getElementById('saveText');
    el.classList.remove('saving', 'saved');
    if (mode === 'saving') { el.classList.add('saving'); txt.textContent = 'Saving…'; }
    else if (mode === 'saved') { el.classList.add('saved'); txt.textContent = 'Saved'; setTimeout(() => { txt.textContent = ''; el.classList.remove('saved'); }, 1800); }
    else { txt.textContent = ''; }
  }

  async function saveEdits() {
    setSaveIndicator('saving');
    try {
      await window.storage.set('edits', JSON.stringify(EDITS), true);
      setSaveIndicator('saved');
    } catch (e) { setSaveIndicator(''); console.error('save failed', e); }
  }
  async function saveMeetings() {
    setSaveIndicator('saving');
    try {
      await window.storage.set('meetings', JSON.stringify(MEETINGS), true);
      setSaveIndicator('saved');
    } catch (e) { setSaveIndicator(''); console.error('save failed', e); }
  }
  async function saveTeam() {
    setSaveIndicator('saving');
    try {
      await window.storage.set('team', JSON.stringify(TEAM), true);
      setSaveIndicator('saved');
    } catch (e) { setSaveIndicator(''); console.error('save failed', e); }
  }

  async function saveModuleStores() {
    setSaveIndicator('saving');
    try {
      await window.storage.set('addedModules', JSON.stringify(ADDED_MODULES), true);
      await window.storage.set('deletedModules', JSON.stringify(DELETED_MODULES), true);
      setSaveIndicator('saved');
    } catch(e){ setSaveIndicator(''); console.error('module save failed',e); }
  }

  // ---------------------------------------------------------------
  // Build flattened item list from source sheets
  // ---------------------------------------------------------------
  let ALL_ITEMS = [];   // every item, flat, with pga/sno/owner/person context
  let PGA_INDEX = [];   // [{pga, sno, owner, person, gid, items:[...]}]
  let LIC_ITEMS = [];   // authoritative Licence & Consumption entries (dedicated sheet)
  const SSO_DETAIL = PGA_DATA.ssoDetail || {};

  function buildData() {
    ALL_ITEMS = [];
    LIC_ITEMS = [];
    const pgaMap = new Map();

    function ensurePga(pga, sno, owner, person) {
      const gid = slugify(pga);
      if (!pgaMap.has(pga)) pgaMap.set(pga, { pga, sno, owner: owner || '', person: person || '', gid, items: [] });
      const g = pgaMap.get(pga);
      if (!g.owner && owner) g.owner = owner;
      if (!g.person && person) g.person = person;
      if (!g.sno && sno) g.sno = sno;
      return g;
    }

    (PGA_DATA.developed || []).forEach(g => {
      const pg = ensurePga(g.pga, g.sno, '', '');
      (g.items || []).forEach(it => {
        const base = Object.assign({}, it, { pga: g.pga, sno: g.sno, gid: pg.gid, origin: 'developed' });
        pg.items.push(base);
      });
    });
    (PGA_DATA.development || []).forEach(g => {
      const pg = ensurePga(g.pga, g.sno, g.owner, g.person);
      (g.items || []).forEach(it => {
        const base = Object.assign({}, it, { pga: g.pga, sno: g.sno, gid: pg.gid, origin: 'development' });
        pg.items.push(base);
      });
    });
    (PGA_DATA.initial || []).forEach(g => {
      const pg = ensurePga(g.pga, g.sno, '', '');
      (g.items || []).forEach(it => {
        const base = Object.assign({}, it, { pga: g.pga, sno: g.sno, gid: pg.gid, origin: 'initial', status: it.status || 'Under discussion' });
        pg.items.push(base);
      });
    });
    (PGA_DATA.notStarted || []).forEach(g => {
      const pg = ensurePga(g.pga, g.sno, '', '');
      pg.items.push({ _id: g._id, type: 'Integration', desc: g.status, status: 'Not started', pga: g.pga, sno: g.sno, gid: pg.gid, origin: 'notStarted' });
    });

    // apply edits overrides + compute buckets
    pgaMap.forEach(pg => {
      // The source sheets sometimes list the exact same certificate/SSO row
      // in both the Deployed and Under Development tabs (a data-entry
      // leftover). Collapse exact type+description duplicates per agency.
      const seen = new Set();
      pg.items = pg.items.filter(it => {
        const key = (it.type || '').trim().toLowerCase() + '|' + (it.desc || '').trim().toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      pg.items.forEach(it => {
        const ov = EDITS[it._id];
        if (ov) Object.assign(it, ov);
        const fallback = it.origin === 'developed' ? 'deployed' : it.origin === 'initial' ? 'discussion' : it.origin === 'notStarted' ? 'notstarted' : 'development';
        it.bucket = classify(it.status, fallback);
        ALL_ITEMS.push(it);
      });
      pg.meeting = MEETINGS[pg.gid] || null;
      pg.team = TEAM[pg.gid] || null;
    });

    // Source S.No restarts at 1 within each original sheet, so combining
    // sheets produces duplicates (1,1,1,1,2,2…). Renumber sequentially
    // over the full alphabetical agency list instead.
    PGA_INDEX = Array.from(pgaMap.values()).sort((a, b) => a.pga.localeCompare(b.pga));
    PGA_INDEX.forEach((pg, i) => { pg.sno = String(i + 1); });

    // Authoritative Licence & Consumption entries (dedicated sheet)
    (PGA_DATA.licConsumption || []).forEach(g => {
      const pg = pgaMap.get(g.pga);
      const gid = pg ? pg.gid : slugify(g.pga);
      (g.items || []).forEach(it => {
        const base = Object.assign({}, it, {
          pga: g.pga, sno: pg ? pg.sno : g.sno, gid,
          type: it.lpco, desc: it.definition, remarks: it.desc, isLic: true
        });
        const ov = EDITS[it._id];
        if (ov) Object.assign(base, ov);
        base.bucket = classify(base.status, 'development');
        LIC_ITEMS.push(base);
      });
    });
  }

  // ---------------------------------------------------------------
  // Modules: Single Sign On + Licence / Consumption
  // ---------------------------------------------------------------
  function moduleItems() {
    const sso = [];
    ALL_ITEMS.forEach(it => {
      const t = (it.type || '').toLowerCase();
      if (t.includes('single sign') || t.includes('sso')) {
        const detail = SSO_DETAIL[it.pga];
        if (detail) {
          const enriched = Object.assign({}, it, {
            ssoContact: detail.contact, ssoNumber: detail.number, ssoLastUpdate: detail.lastUpdate,
            ssoUpdates: detail.updates
          });
          if (!EDITS[it._id]) {
            if (detail.currentStatus) enriched.desc = detail.currentStatus;
            if (detail.devStatus) { enriched.status = detail.devStatus; enriched.bucket = classify(detail.devStatus, it.bucket); }
          }
          sso.push(enriched);
        } else {
          sso.push(it);
        }
      }
    });
    return { sso, lic: LIC_ITEMS };
  }

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  const state = { view: 'kanban', search: '', owner: [], pga: [], moduleFilter: '', modTypeFilter: [], overallFilter: [], bucketFilter: '', openGroups: new Set(), openMeeting: null, meetingDraft: null, openEdit: null, openTeam: null };

  function pgaMatchesOverall(pg, filter) {
    const vals=selectedValues(filter);
    if(!vals.length) return true;
    return vals.includes(pgaAggregateStatus(pg).label);
  }

  function setView(view) {
    state.view = view;
    document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-view') === view));
    render();
  }

  function matchesSearch(text, term) { return !term || (text || '').toLowerCase().includes(term); }
  function itemMatchesSearch(it, term) {
    if (!term) return true;
    return matchesSearch(it.pga, term) || matchesSearch(it.type, term) || matchesSearch(it.desc, term) || matchesSearch(it.status, term) || matchesSearch(it.remarks, term);
  }
  function itemBadge(bucket, textOverride) {
    const meta = BUCKET_META[bucket] || BUCKET_META.development;
    return `<span class="badge ${meta.cls}">${esc(textOverride || meta.label)}</span>`;
  }

  // ---------------------------------------------------------------
  // Stats + progress
  // ---------------------------------------------------------------
  function getFilteredStatItems() {
    const term = state.search.trim().toLowerCase();
    return ALL_ITEMS.filter(it => {
      if (!itemMatchesSearch(it, term)) return false;
      if (!moduleMatch(it, state.moduleFilter)) return false;
      if (!modTypeMatch(it, state.modTypeFilter)) return false;
      if (!filterHas(state.pga, it.pga)) return false;
      if (state.owner) {
        const pg = PGA_INDEX.find(p => p.gid === it.gid);
        if (!pg || !filterHas(state.owner, pg.person)) return false;
      }
      if (state.overallFilter) {
        const pg = PGA_INDEX.find(p => p.gid === it.gid);
        if (!pg || !pgaMatchesOverall(pg, state.overallFilter)) return false;
      }
      return true;
    });
  }

  function getModuleCounts() {
    const term = state.search.trim().toLowerCase();
    const { sso, lic } = moduleItems();
    let ssoF = filterModuleList(sso, term), licF = filterModuleList(lic, term);
    if (state.moduleFilter === 'sso') licF = [];
    if (state.moduleFilter === 'lic') ssoF = [];
    return { sso: ssoF.length, lic: licF.length, total: ssoF.length + licF.length };
  }


  function renderItemCompletionSummary(filtered) {
    const el = document.getElementById('itemCompletionSummary');
    if (!el) return;

    const total = filtered.length;
    const completed = filtered.filter(it => it.bucket === 'deployed');
    const pending = filtered.filter(it => it.bucket !== 'deployed');
    const pct = total ? (completed.length / total * 100) : 0;
    const pctText = pct.toFixed(1).replace('.0', '');

    const itemLabel = n => n === 1 ? 'Item' : 'Items';
    const listHtml = (items, completedList) => {
      if (!items.length) return `<div class="completion-empty">${completedList ? 'No completed/deployed items.' : 'No pending items.'}</div>`;
      return `<div class="completion-items">${items.map(it => `
        <div class="completion-item">
          <span class="icon">${completedList ? '✓' : '⏳'}</span>
          <div>
            <div class="name">${esc(it.type || it.lpco || 'Untitled item')}</div>
            <div class="agency">${esc(it.pga || 'Unknown agency')} · ${esc(it.status || 'Status not specified')}</div>
          </div>
        </div>`).join('')}</div>`;
    };

    const filterNote = (state.search || selectedValues(state.pga).length || selectedValues(state.owner).length || selectedValues(state.overallFilter).length || selectedValues(state.modTypeFilter).length)
      ? 'Counts and item lists reflect the current dashboard filters.'
      : 'Counts and item lists reflect all tracked Items/Modules in the dashboard.';

    el.innerHTML = `
      <div class="completion-summary-head">
        <div>
          <div class="completion-summary-title">Item / Module Deployment Status</div>
          <div class="completion-summary-sub">Overall completion based on deployed Items/Modules</div>
        </div>
        <div class="completion-summary-message">${completed.length} out of ${total} ${itemLabel(total)} Completed</div>
      </div>
      <div class="completion-kpis">
        <div class="completion-kpi total">
          <div class="kpi-num">${total}</div>
          <div class="kpi-label">Total Items</div>
        </div>
        <div class="completion-kpi completed">
          <div class="kpi-num">${completed.length}</div>
          <div class="kpi-label">Completed / Deployed</div>
        </div>
        <div class="completion-kpi pending">
          <div class="kpi-num">${pending.length}</div>
          <div class="kpi-label">Pending / Not Completed</div>
        </div>
        <div class="completion-kpi percent">
          <div class="kpi-num">${pctText}%</div>
          <div class="kpi-label">Overall Progress</div>
        </div>
      </div>
      <div class="completion-detail">
        <div class="completion-list completed">
          <div class="completion-list-head">
            <span>✓ Completed / Deployed</span>
            <span class="count">${completed.length}</span>
          </div>
          ${listHtml(completed, true)}
        </div>
        <div class="completion-list pending">
          <div class="completion-list-head">
            <span>⏳ Pending / Not Completed</span>
            <span class="count">${pending.length}</span>
          </div>
          ${listHtml(pending, false)}
        </div>
      </div>
      <div class="completion-note">${filterNote}</div>
      <div class="completion-bifurcation">
        <div class="bifurcation-title">Status Bifurcation</div>
        <div class="bifurcation-grid">
          <div class="bifurcation-card deployed">
            <span class="bifurcation-dot"></span>
            <div><strong>${completed.length}</strong><span>Completed / Deployed</span></div>
          </div>
          <div class="bifurcation-card pending">
            <span class="bifurcation-dot"></span>
            <div><strong>${pending.length}</strong><span>Pending / Not Completed</span></div>
          </div>
          <div class="bifurcation-card total">
            <span class="bifurcation-dot"></span>
            <div><strong>${total}</strong><span>Total Items / Modules</span></div>
          </div>
        </div>
      </div>
    `;
  }

  function renderStats() {
    const statsRow = document.getElementById('statsRow');
    const filtered = getFilteredStatItems();
    const anyFilterActive = !!(state.search || selectedValues(state.pga).length || selectedValues(state.owner).length || selectedValues(state.overallFilter).length || selectedValues(state.modTypeFilter).length);
    const counts = { deployed: 0, development: 0, discussion: 0, notstarted: 0 };
    filtered.forEach(it => counts[it.bucket] = (counts[it.bucket] || 0) + 1);
    const total = filtered.length;
    renderItemCompletionSummary(filtered);
    const agencyCount = anyFilterActive ? new Set(filtered.map(it => it.gid)).size : PGA_INDEX.length;
    const stats = [
      { key: '', num: agencyCount, label: anyFilterActive ? 'Matching agencies' : 'Total agencies', color: 'var(--accent)' },
      { key: 'deployed', num: counts.deployed, label: 'Deployed', color: 'var(--deployed)' },
      { key: 'development', num: counts.development, label: 'In development', color: 'var(--development)' },
      { key: 'discussion', num: counts.discussion, label: 'Discussion', color: 'var(--discussion)' },
      { key: 'notstarted', num: counts.notstarted, label: 'Not started', color: 'var(--notstarted)' }
    ];
    statsRow.innerHTML = stats.map(s => `
      <div class="stat ${state.bucketFilter === s.key && s.key ? 'active' : ''}" data-filter="${s.key}" style="--stat-color:${s.color}">
        <div class="num">${s.num}</div>
        <div class="lbl">${s.key ? '<span class="swatch"></span>' : ''}${s.label}</div>
      </div>`).join('');
    statsRow.querySelectorAll('.stat').forEach(el => {
      el.addEventListener('click', () => {
        const f = el.getAttribute('data-filter');
        if (!f) { state.bucketFilter = ''; setView('pga'); return; }
        state.bucketFilter = (state.bucketFilter === f) ? '' : f;
        render();
      });
    });
    const track = document.getElementById('progressTrack');
    track.innerHTML = BUCKET_ORDER.map(b => `<div class="progress-seg" style="width:${total ? (counts[b]/total*100) : 0}%; background:var(--${b})"></div>`).join('');

    const mods = getModuleCounts();
  }

  // ---------------------------------------------------------------
  // Editing UI
  // ---------------------------------------------------------------
  function editPanelHtml(it) {
    return `
      <div class="edit-panel" data-editpanel="${it._id}">
        <div class="ep-row">
          <div class="ep-field" style="flex:2"><label>Description</label><textarea data-f="desc" rows="2">${esc(it.desc || '')}</textarea></div>
        </div>
        <div class="ep-row">
          <div class="ep-field"><label>Status</label><input type="text" data-f="status" value="${esc(it.status || '')}"></div>
          <div class="ep-field"><label>Go-live / planned date</label><input type="text" data-f="golive" value="${esc(it.golive || it.date || '')}"></div>
        </div>
        <div class="ep-row">
          <div class="ep-field" style="flex:2"><label>Remarks / next action</label><textarea data-f="remarks" rows="2">${esc(it.remarks || '')}</textarea></div>
          <div class="ep-field"><label>Planned action</label><input type="text" data-f="plan" value="${esc(it.plan || '')}"></div>
        </div>
        <div class="mp-actions">
          <button class="btn-save" data-save-item="${it._id}">Save</button>
          <button class="btn-cancel" data-cancel-item="${it._id}">Cancel</button>
        </div>
      </div>`;
  }

  function openMeetingEditor(gid, pg) {
    const src = (pg && pg.meeting) ? pg.meeting : { date: '', status: 'Scheduled', points: [] };
    state.meetingDraft = { gid, date: src.date || '', status: src.status || 'Scheduled', agenda: src.agenda || '', points: (src.points || []).slice(), sourceDocument: src.sourceDocument || '' };
    state.openMeeting = gid;
  }

  function toggleMeeting(gid) {
    if (state.openMeeting === gid) {
      state.openMeeting = null; state.meetingDraft = null;
    } else {
      const pg = PGA_INDEX.find(p => p.gid === gid);
      openMeetingEditor(gid, pg);
      state.openGroups.add(gid + ':deployed'); state.openGroups.add(gid + ':development');
      state.openGroups.add(gid + ':discussion'); state.openGroups.add(gid + ':notstarted');
      state.openGroups.add('pgaview:' + gid);
    }
    render();
  }

  function toggleTeam(gid) {
    if (state.openTeam === gid) { state.openTeam = null; }
    else {
      state.openTeam = gid;
      state.openGroups.add(gid + ':deployed'); state.openGroups.add(gid + ':development');
      state.openGroups.add(gid + ':discussion'); state.openGroups.add(gid + ':notstarted');
      state.openGroups.add('pgaview:' + gid);
    }
    render();
  }

  function teamPanelHtml(pg) {
    const t = pg.team || {};
    const resourceDefault = t.resource || pg.person || '';
    return `
      <div class="team-panel" data-teampanel="${pg.gid}">
        <div><label>Engaged resource</label><input type="text" data-tf="resource" placeholder="Infosys developer" value="${esc(resourceDefault)}"></div>
        <div><label>Inspector</label><input type="text" data-tf="inspector" placeholder="Customs Inspector" value="${esc(t.inspector || '')}"></div>
        <div><label>Superintendent</label><input type="text" data-tf="superintendent" placeholder="Customs Superintendent" value="${esc(t.superintendent || '')}"></div>
        <div class="mp-actions">
          <button class="btn-save" data-save-team="${pg.gid}">Save</button>
          <button class="btn-cancel" data-cancel-team="${pg.gid}">Cancel</button>
        </div>
      </div>`;
  }

  function wireTeamPanel(container) {
    container.querySelectorAll('[data-save-team]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const gid = btn.getAttribute('data-save-team');
        const panel = container.querySelector(`[data-teampanel="${gid}"]`);
        const fields = {};
        panel.querySelectorAll('[data-tf]').forEach(inp => fields[inp.getAttribute('data-tf')] = inp.value.trim());
        if (fields.resource || fields.inspector || fields.superintendent) TEAM[gid] = fields; else delete TEAM[gid];
        await saveTeam();
        state.openTeam = null;
        buildData();
        render();
      });
    });
    container.querySelectorAll('[data-cancel-team]').forEach(btn => {
      btn.addEventListener('click', () => { state.openTeam = null; render(); });
    });
  }

  function meetingPanelHtml(pg) {
    const d = state.meetingDraft && state.meetingDraft.gid === pg.gid
      ? state.meetingDraft
      : {
          date: '',
          status: 'Scheduled',
          agenda: '',
          points: [],
          sourceDocument: ''
        };

    return `
      <div class="meeting-panel" data-meetingpanel="${pg.gid}">
        <div class="mp-row">
          <div>
            <label>Meeting date</label>
            <input class="mp-date" type="date" data-mf="date" value="${esc(d.date || '')}">
          </div>
          <div>
            <label>Status</label>
            <select class="mp-status" data-mf="status">
              <option value="Scheduled" ${d.status === 'Scheduled' ? 'selected' : ''}>Scheduled</option>
              <option value="Completed" ${d.status === 'Completed' ? 'selected' : ''}>Meeting completed</option>
            </select>
          </div>
        </div>

        <div class="meeting-agenda-box">
          <label>Agenda Point <span style="color:#FF6B7A">*</span></label>
          <textarea
            data-mf="agenda"
            placeholder="Enter the agenda point / topic to be discussed"
            required

  function wireEditPanel(container) {
    container.querySelectorAll('[data-save-item]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-save-item');
        const panel = container.querySelector(`[data-editpanel="${id}"]`);
        const fields = {};
        panel.querySelectorAll('[data-f]').forEach(inp => fields[inp.getAttribute('data-f')] = inp.value.trim());
        EDITS[id] = Object.assign({}, EDITS[id] || {}, fields);
        await saveEdits();
        state.openEdit = null;
        buildData();
        render();
      });
    });
    container.querySelectorAll('[data-cancel-item]').forEach(btn => {
      btn.addEventListener('click', () => { state.openEdit = null; render(); });
    });
  }
  function syncDraftFromPanel(gid, container) {
    const panel = container.querySelector(`[data-meetingpanel="${gid}"]`);
    if (!panel || !state.meetingDraft || state.meetingDraft.gid !== gid) return;
    panel.querySelectorAll('[data-mf]').forEach(inp => { state.meetingDraft[inp.getAttribute('data-mf')] = inp.value.trim(); });
  }

  function wireMeetingPanel(container) {
    container.querySelectorAll('[data-agenda-upload]').forEach(input => {
      input.addEventListener('change', async () => {
        const gid = input.getAttribute('data-agenda-upload');
        const file = input.files && input.files[0];
        if(!file) return;

        syncDraftFromPanel(gid, container);
        state.meetingDraft.sourceDocument = file.name;

        const panel = container.querySelector(`[data-meetingpanel="${gid}"]`);
        const fileName = panel?.querySelector('[data-agenda-file-name]');
        if(fileName) fileName.textContent = file.name;

        try{
          const text = await extractPgaDocumentText(file);
          if(!text.trim()) throw new Error('No readable text was found in the document.');

          const detected = parseMeetingDocumentPoints(text);
          const box = panel.querySelector('[data-agenda-detected]');
          const list = panel.querySelector('[data-agenda-detected-list]');

          if(!detected.length){
            alert('No agenda point could be detected. Please enter the agenda manually.');
            return;
          }

          state.meetingDraft.detectedAgendaPoints = detected;
          list.innerHTML = detected.map((p,i) =>
            `<div class="meeting-detected-item">${i+1}. ${esc(p)}</div>`
          ).join('');
          box.classList.add('show');
        }catch(err){
          alert(err.message || 'Unable to read the agenda document.');
        }
      });
    });

    container.querySelectorAll('[data-apply-agenda]').forEach(btn => {
      btn.addEventListener('click', () => {
        const gid = btn.getAttribute('data-apply-agenda');
        syncDraftFromPanel(gid, container);
        const detected = state.meetingDraft.detectedAgendaPoints || [];
        if(!detected.length) return;

        state.meetingDraft.agenda = detected.join('\\n');
        state.meetingDraft.detectedAgendaPoints = [];
        render();
      });
    });

    container.querySelectorAll('[data-cancel-agenda-detected]').forEach(btn => {
      btn.addEventListener('click', () => {
        const panel = btn.closest('[data-meetingpanel]');
        panel?.querySelector('[data-agenda-detected]')?.classList.remove('show');
        if(state.meetingDraft) state.meetingDraft.detectedAgendaPoints = [];
      });
    });

    container.querySelectorAll('[data-save-meeting]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const gid = btn.getAttribute('data-save-meeting');
        syncDraftFromPanel(gid, container);
        const d = state.meetingDraft;

        if(!d.agenda || !d.agenda.trim()){
          alert('Please enter or upload an Agenda Point before saving the meeting.');
          container.querySelector(`[data-meetingpanel="${gid}"] [data-mf="agenda"]`)?.focus();
          return;
        }

        MEETINGS[gid] = {
          date: d.date || '',
          status: d.status || 'Scheduled',
          agenda: d.agenda.trim(),
          points: [],
          sourceDocument: d.sourceDocument || ''
        };

        await saveMeetings();
        state.openMeeting = null;
        state.meetingDraft = null;
        buildData();
        render();
      });
    });

    container.querySelectorAll('[data-cancel-meeting]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.openMeeting = null;
        state.meetingDraft = null;
        render();
      });
    });
  }

  function parseMeetingDocumentPoints(text){
    const raw = String(text || '').replace(/\r/g,'');
    const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
    const points = [];

    // Prefer explicitly labelled agenda/discussion/MoM/action-point sections.
    let active = false;
    const sectionRx = /^(agenda|agenda points|discussion points|meeting points|minutes|mom|action points|key discussion|key points)\s*:?\s*$/i;
    const stopRx = /^(attendees|participants|meeting date|date|decisions|remarks|next steps|action items)\s*:?\s*$/i;

    for(const line of lines){
      if(sectionRx.test(line)){ active = true; continue; }
      if(stopRx.test(line)){ active = false; continue; }
      if(active){
        const cleaned = line.replace(/^[-•*]\s*/,'').replace(/^\d+[\).\-\s]+/,'').trim();
        if(cleaned.length >= 4) points.push(cleaned);
      }
    }

    // Fallback: bullet/numbered lines across the document.
    if(!points.length){
      for(const line of lines){
        const m = line.match(/^(?:[-•*]\s+|\d+[\).\-\s]+)(.+)$/);
        if(m && m[1].trim().length >= 6) points.push(m[1].trim());
      }
    }

    // Remove duplicates and cap to a sensible number for the meeting editor.
    return Array.from(new Set(points)).slice(0,50);
  }
